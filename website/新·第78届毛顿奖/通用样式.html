<html>
  <head>
    <title>the_jayfeather的通用样式</title>
    <style>
      .card{
        background-color: rgba(255, 255, 255, 0.85);
        max-width: 700px;
        margin: 0 auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      img{
        heiht:250;
        border-radius: 15%;
        border: 1px solid black;
        margin: 10px 0;
      }
      h1{
        font-family:"楷体";
        font-size:35px;
      }
      h2{
        font-family:"霞鹜文楷";
        font-size:25px;
      }
      p{
        font-family:"霞鹜文楷";
        font-size:20px;
      }
      body{
        background-color:#87CEFA;
      }
    </style>
  </head>
  <body>
    <div class=card>
      <h1>一级标题</h1>
      <h2>二级标题</h2>
        <p><b>加粗正文</b></p>
        <p>正文</p>
        <img src="通用样式.png" height=150 title="通用样式！">
        <a href="https://www.douyin.com"><button class="button">抖音推广链接</button></a>
    </div>
  </body>
</html>
