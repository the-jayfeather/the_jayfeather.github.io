<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页换算器 · 单位换算</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%23225588'/%3E%3Cpath%20d='M50%2088V36M18%2088h64M24%2024h52M50%2036%2024%2024l-6%2024h64l-6-24L50%2036Z'%20fill='none'%20stroke='%2366CCFF'%20stroke-width='6'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='50'%20cy='62'%20r='8'%20fill='%23BBEEFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=LXGW+WenKai&display=swap">
<style>
/* ============================================================
 * 单位换算器 —— 天依配色（对齐 style.css）
 * 深海蓝 #062742 / 导航蓝 #225588 / 天依蓝 #66CCFF
 * 浅冰蓝 #BBEEFF / 亮蓝 #99DDFF / 云白 #E0F5FF / 墨蓝 #113355
 * ============================================================ */
:root {
  --bg: #062742;
  --nav: #225588;
  --tianyi: #66CCFF;
  --ice: #BBEEFF;
  --sky: #99DDFF;
  --cyan: #88DDFF;
  --cloud: #E0F5FF;
  --ink: #113355;
  --ink-deep: #032138;
  --card-bg: rgba(187, 238, 255, 0.20);
  --card-solid: rgba(187, 238, 255, 0.85);
  --border: rgba(102, 204, 255, 0.18);
  --border-strong: rgba(102, 204, 255, 0.22);
  --shadow: rgba(34, 85, 136, 0.28);
  --bar: rgba(20, 35, 55, 0.92);
  --select-bg: rgba(40, 70, 105, 0.6);
  --scroll: #44688C;
  --placeholder: #739CBF;
  --warn-bg: rgba(255, 168, 148, 0.78);
  --radius: 18px;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  min-height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--cloud);
  font-family: 'LXGW WenKai', '霞鹜文楷', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--tianyi); }

/* ---------- 顶部导航栏 ---------- */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  background-color: var(--nav);
  box-shadow: 0 2px 10px rgba(34, 85, 136, 0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  z-index: 1000;
}
.brand { display: flex; align-items: center; gap: 12px; user-select: none; }
.brand-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: rgba(102, 204, 255, 0.18);
  border: 1px solid rgba(102, 204, 255, 0.35);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-icon svg { width: 22px; height: 22px; }
.brand-name {
  font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
  font-size: 24px;
  font-weight: bold;
  color: var(--sky);
  letter-spacing: 2px;
}
.brand-sub {
  font-size: 12px;
  color: rgba(187, 238, 255, 0.65);
  margin-left: 2px;
  align-self: flex-end;
  padding-bottom: 4px;
}
.nav-right { display: flex; align-items: center; gap: 14px; }
.time-source {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  padding: 5px 12px;
  border-radius: 9999px;
  background: var(--select-bg);
  color: var(--ice);
  border: 1px solid var(--border-strong);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.time-source:hover { border-color: var(--tianyi); }
.time-source .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--placeholder);
  flex-shrink: 0;
}
.time-source.online .dot { background: #7BE38A; box-shadow: 0 0 6px rgba(123, 227, 138, 0.7); }
.time-source.local .dot { background: #F4C96B; box-shadow: 0 0 6px rgba(244, 201, 107, 0.7); }

/* ---------- 主区 ---------- */
.main {
  padding-top: 64px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.content {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 18px 20px 24px;
  flex: 1;
}

/* ---------- 通用卡片 ---------- */
.panel {
  background-color: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 6px 22px var(--shadow);
  padding: 16px 20px;
  margin-bottom: 16px;
}
.panel-title {
  font-size: 17px;
  color: var(--ice);
  margin: 0 0 12px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 1px;
}
.panel-title::before {
  content: '';
  width: 9px; height: 9px;
  border-radius: 50%;
  background-color: var(--tianyi);
  flex-shrink: 0;
}
.panel-title .tiny-tag {
  margin-left: auto;
  font-size: 11px;
  color: rgba(187, 238, 255, 0.55);
  font-weight: normal;
  white-space: nowrap;
}

/* ---------- 分类选择 ---------- */
.cat-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 9999px;
  background: var(--select-bg);
  border: 1px solid var(--border-strong);
  color: var(--ice);
  font-family: inherit;
  font-size: 13.5px;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
}
.cat-tab svg { width: 15px; height: 15px; opacity: 0.85; flex-shrink: 0; }
.cat-tab:hover { background: rgba(102, 204, 255, 0.18); border-color: var(--tianyi); }
.cat-tab.active { background: var(--tianyi); color: var(--ink-deep); border-color: var(--tianyi); }
.cat-tab.active svg { opacity: 1; }

/* ---------- 换算行 ---------- */
.convert-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: end;
}
.c-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.c-label { font-size: 12px; color: var(--sky); letter-spacing: 2px; }
.num-input, .unit-select, .d-input {
  height: 46px;
  border-radius: 12px;
  background: var(--select-bg);
  border: 1px solid var(--border-strong);
  color: var(--ice);
  font-family: inherit;
  font-size: 16px;
  padding: 0 12px;
  outline: none;
  transition: border 0.18s ease, box-shadow 0.18s ease;
  width: 100%;
}
.num-input:focus, .unit-select:focus, .d-input:focus {
  border-color: var(--tianyi);
  box-shadow: 0 0 0 3px rgba(102, 204, 255, 0.18);
}
.num-input { font-family: 'Microsoft YaHei', '微软雅黑', sans-serif; font-size: 18px; }
.result-input {
  color: var(--tianyi);
  font-weight: bold;
  font-size: 19px;
  background: rgba(102, 204, 255, 0.10);
  cursor: default;
}
.unit-select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 32px;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Cpath%20d='M4%206l4%204%204-4'%20fill='none'%20stroke='%2366CCFF'%20stroke-width='1.6'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 14px;
  cursor: pointer;
  font-size: 14px;
}
.unit-select option { background: #0A3352; color: var(--ice); }
.swap-btn { height: 46px; width: 46px; align-self: end; font-size: 20px; }

.tool-btn {
  display: flex; align-items: center; justify-content: center;
  min-width: 36px; height: 36px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--select-bg);
  border: 1px solid var(--border-strong);
  color: var(--ice);
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tool-btn:hover { background: rgba(102, 204, 255, 0.25); border-color: var(--tianyi); }
.tool-btn:disabled {
  opacity: 0.38;
  cursor: not-allowed;
  background: var(--select-bg);
  border-color: var(--border);
  box-shadow: none;
}
.tool-btn:disabled:hover { background: var(--select-bg); border-color: var(--border); }
.tool-btn.primary { background: var(--tianyi); color: var(--ink-deep); font-size: 14px; }
.tool-btn.primary:hover { background: var(--ice); }

.result-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.base-note { font-size: 12px; color: var(--placeholder); }

.sub-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: normal;
  margin: 14px 0 8px 0;
  letter-spacing: 1px;
  color: var(--ice);
}
.sub-title::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--tianyi);
}
.sub-title .q-base { color: var(--tianyi); font-weight: bold; }

/* ---------- 全单位速查表 ---------- */
.quick-table {
  margin-top: 8px;
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.qt-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 12px;
  font-size: 13px;
  border-bottom: 1px dashed rgba(102, 204, 255, 0.12);
  cursor: pointer;
  transition: background 0.14s ease;
}
.qt-row:last-child { border-bottom: none; }
.qt-row:hover { background: rgba(102, 204, 255, 0.12); }
.qt-row .q-name { color: var(--sky); flex-shrink: 0; white-space: nowrap; }
.qt-row .q-val {
  color: var(--ice);
  font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.qt-row .q-val b { color: var(--tianyi); font-weight: 600; }
.qt-row.current { background: rgba(102, 204, 255, 0.18); border-left: 3px solid var(--tianyi); }

/* ---------- 时间日期工具 ---------- */
.view-tabs {
  display: flex;
  background: var(--bar);
  border: 1px solid var(--border-strong);
  border-radius: 9999px;
  padding: 4px;
  gap: 4px;
  width: fit-content;
  max-width: 100%;
  overflow-x: auto;
}
.view-tab {
  border: none;
  background: transparent;
  color: var(--ice);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 16px;
  border-radius: 9999px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.view-tab:hover { background: rgba(102, 204, 255, 0.18); }
.view-tab.active { background: var(--tianyi); color: var(--ink-deep); }

.dtool { margin-top: 14px; }
.d-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.d-field { display: flex; flex-direction: column; gap: 6px; }
.d-label { font-size: 12px; color: var(--sky); letter-spacing: 1px; }
.d-input { height: 44px; font-size: 14px; color-scheme: dark; }
.d-input.d-num { width: 120px; }
.d-output {
  font-size: 15px;
  color: var(--cloud);
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(102, 204, 255, 0.10);
  border: 1px dashed var(--border-strong);
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  line-height: 1.5;
}
.d-output b { color: var(--tianyi); font-weight: bold; }
.d-output .dim { color: var(--placeholder); font-size: 13px; }

/* ---------- 页脚 ---------- */
.footer {
  margin-top: auto;
  padding: 18px 0 26px;
  text-align: center;
  color: var(--sky);
  font-size: 13px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.footer .foot-note { font-size: 12px; color: var(--placeholder); }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 36px;
  transform: translateX(-50%) translateY(20px);
  background: var(--bar);
  border: 1px solid var(--border-strong);
  color: var(--ice);
  padding: 10px 22px;
  border-radius: 9999px;
  font-size: 14px;
  box-shadow: 0 8px 26px rgba(4, 22, 40, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: all 0.28s ease;
  z-index: 1300;
  max-width: 80vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 响应式 ---------- */
@media (max-width: 640px) {
  .brand-sub { display: none; }
  .brand-name { font-size: 20px; }
  .content { padding: 14px 14px 20px; }
  .convert-row { grid-template-columns: 1fr; }
  .swap-btn { width: 100%; height: 42px; }
  .cat-tab { min-height: 44px; padding: 8px 12px; font-size: 14px; }
  .cat-tab svg { width: 16px; height: 16px; }
  .tool-btn { min-width: 44px; min-height: 44px; }
  .time-source { font-size: 13px; padding: 6px 10px; }
  .unit-select, .d-input { font-size: 16px; }
  .d-input.d-num { width: 100%; }
  .view-tabs { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<!-- ================= 顶部导航栏 ================= -->
<header class="navbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21V9M4 21h16M6 6h12M12 9 6 6l-1.6 6h15.2L18 6 12 9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="15.5" r="1.7" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">一只松鸦羽的网页换算器</span>
    <span class="brand-sub">单位换算 · 万物可量</span>
  </div>
  <div class="nav-right">
    <span class="time-source" id="fxStatus" title="点击重新检测汇率来源">
      <span class="dot"></span><span id="fxStatusText">汇率检测中…</span>
    </span>
  </div>
</header>

<!-- ================= 主区 ================= -->
<main class="main">
  <div class="content">

    <!-- 分类选择 -->
    <section class="panel">
      <h3 class="panel-title">选择单位类型 <span class="tiny-tag">共 14 类 · 支持同类型互转</span></h3>
      <div class="cat-tabs" id="catTabs"></div>
    </section>

    <!-- 换算器（通用类别 + 货币 + 时间） -->
    <section class="panel" id="converterPanel">
      <h3 class="panel-title" id="convTitle">长度换算 <span class="tiny-tag" id="convNote"></span></h3>
      <div class="convert-row">
        <div class="c-group">
          <label class="c-label" for="fromVal">输入值</label>
          <input class="num-input" id="fromVal" type="number" inputmode="decimal" value="1" autocomplete="off" spellcheck="false">
          <select class="unit-select" id="fromUnit" aria-label="源单位"></select>
        </div>
        <button class="tool-btn swap-btn" id="swapBtn" title="交换单位" aria-label="交换单位">⇄</button>
        <div class="c-group">
          <label class="c-label" for="toVal">换算结果</label>
          <input class="num-input result-input" id="toVal" type="text" readonly tabindex="-1" value="—">
          <select class="unit-select" id="toUnit" aria-label="目标单位"></select>
        </div>
      </div>
      <div class="result-actions">
        <button class="tool-btn" id="copyBtn" title="复制结果数值">复制结果</button>
        <span class="base-note" id="baseNote"></span>
      </div>
      <h4 class="sub-title">1 <span class="q-base" id="qFromName">米</span> 等于 …（点击行可设为目标单位）</h4>
      <div class="quick-table" id="quickTable"></div>
    </section>

    <!-- 时间日期工具 -->
    <section class="panel" id="datePanel" hidden>
      <h3 class="panel-title">时间日期工具 <span class="tiny-tag">时间戳 · 加减 · 相差</span></h3>
      <div class="view-tabs" id="dateTabs">
        <button class="view-tab active" data-dtab="ts">时间戳互转</button>
        <button class="view-tab" data-dtab="add">日期加减</button>
        <button class="view-tab" data-dtab="diff">日期相差</button>
      </div>

      <div class="dtool" id="dt-ts">
        <div class="d-row">
          <div class="d-field">
            <label class="d-label" for="tsDt">日期时间</label>
            <input class="d-input" id="tsDt" type="datetime-local">
          </div>
          <button class="tool-btn primary" id="tsNowBtn">现在</button>
          <div class="d-output" id="tsOut"><span class="dim">Unix 时间戳：</span><b id="tsOutSec">—</b><span class="dim">秒 · </span><b id="tsOutMs">—</b><span class="dim">毫秒</span></div>
        </div>
        <div class="d-row">
          <div class="d-field">
            <label class="d-label" for="tsNum">Unix 时间戳</label>
            <input class="d-input d-num" id="tsNum" type="number" inputmode="numeric" autocomplete="off" placeholder="例如 1777298400">
          </div>
          <div class="d-field">
            <label class="d-label" for="tsUnit">单位</label>
            <select class="d-input unit-select" id="tsUnit" style="width:110px;"><option value="s">秒</option><option value="ms">毫秒</option></select>
          </div>
          <div class="d-output" id="tsOutDate"><span class="dim">对应时间：</span><b id="tsDateText">—</b></div>
        </div>
      </div>

      <div class="dtool" id="dt-add" hidden>
        <div class="d-row">
          <div class="d-field">
            <label class="d-label" for="addDate">起始日期</label>
            <input class="d-input" id="addDate" type="date">
          </div>
          <div class="d-field">
            <label class="d-label" for="addNum">增减量</label>
            <input class="d-input d-num" id="addNum" type="number" inputmode="numeric" value="30" autocomplete="off">
          </div>
          <div class="d-field">
            <label class="d-label" for="addUnit">单位</label>
            <select class="d-input unit-select" id="addUnit" style="width:100px;"><option value="d">天</option><option value="w">周</option><option value="m">月</option><option value="y">年</option></select>
          </div>
          <button class="tool-btn primary" id="addCalcBtn">计算</button>
          <button class="tool-btn" id="addTodayBtn">今天</button>
        </div>
        <div class="d-output" id="addResult">结果：<b id="addResultText">—</b></div>
      </div>

      <div class="dtool" id="dt-diff" hidden>
        <div class="d-row">
          <div class="d-field">
            <label class="d-label" for="diffA">起始日期</label>
            <input class="d-input" id="diffA" type="date">
          </div>
          <div class="d-field">
            <label class="d-label" for="diffB">结束日期</label>
            <input class="d-input" id="diffB" type="date">
          </div>
          <button class="tool-btn primary" id="diffCalcBtn">计算</button>
        </div>
        <div class="d-output" id="diffResult">结果：<b id="diffResultText">—</b></div>
      </div>
    </section>

  </div>
</main>

<!-- ================= 页脚 ================= -->
<footer class="footer">
  <span>一只松鸦羽的网页换算器 · Jayfeather 导航站工具集</span>
  <span class="foot-note" id="footNote"></span>
</footer>

<div class="toast" id="toast">已复制</div>

<script>
/* ================= 数据与换算引擎 ================= */
const PI = Math.PI;

/* 本地留存的离线基准汇率（获取自 open.er-api.com，2026-09-27） */
const LOCAL_FX_DATE = '2026-09-27';
const LOCAL_FX_RATES = {
  CNY: 1, USD: 0.14861, EUR: 0.130531, JPY: 23.416463, GBP: 0.112301,
  HKD: 1.165337, TWD: 4.739336, KRW: 203.086921, SGD: 0.189662, AUD: 0.211976,
  CAD: 0.209809, CHF: 0.123109, NZD: 0.263856, THB: 4.963575, MYR: 0.606575,
  IDR: 2652.519894, PHP: 9.345794, VND: 3875.968992, INR: 14.265132, RUB: 12.626263,
  BRL: 0.769408, MXN: 2.602811, ZAR: 2.423988, TRY: 7.251632, SEK: 1.476287,
  NOK: 1.412855, DKK: 0.975684, PLN: 0.570646, CZK: 3.196931, HUF: 47.619048,
  AED: 0.545769, SAR: 0.557287, KWD: 0.046056, BHD: 0.055877, QAR: 0.54094,

/* 标准化类别：tuple 展开为对象 */
CATS.forEach(function(c){
  if (c.type !== 'temp' && c.units) {
    c.units = c.units.map(function(u){ return { id: u[0], n: u[1], f: u[2] }; });
  }
  if (c.type === 'temp') {
    c.units = c.units.map(function(u){ return { id: u[0], n: u[1], to: u[2], from: u[3] }; });
  }
});

/* 换算引擎：value 从 from 单位转 to 单位（base = 基准量） */
function convert(value, cat, fromId, toId){
  const from = cat.units.find(u => u.id === fromId);
  const to   = cat.units.find(u => u.id === toId);
  if (!from || !to || !isFinite(value)) return NaN;
  if (cat.type === 'temp') return to.from(from.to(value));
  return value * from.f / to.f;
}

/* 数字格式化：12 位有效数字 + 千分位；极小/极大用科学计数 */
function fmt(n){
  if (!Number.isFinite(n)) return '—';
  if (Object.is(n, -0)) n = 0;
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e15 || a < 1e-9) {
    return n.toExponential(6).replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e');
  }
  let s = n.toPrecision(12);
  if (/e/i.test(s)) {
    s = n.toExponential(8).replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e');
  } else {
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  }
  const neg = s.startsWith('-');
  s = s.replace('-', '');
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + parts.join('.');
}
/* 复制用原始数值 */
function rawNum(n){
  if (!Number.isFinite(n)) return '';
  return String(parseFloat(n.toPrecision(12)));
}

  const pill = $('fxStatus'), txt = $('fxStatusText');
  pill.classList.remove('online', 'local');
  txt.textContent = '汇率检测中…';
  let got = null;
  for (const url of FX_ENDPOINTS) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 9000);
      const res = await fetch(url, { signal: ctl.signal });
      clearTimeout(timer);
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.rates && data.rates.CNY !== undefined) {
        got = { date: data.date || data.time_last_update_utc || '', rates: data.rates };
        break;
      }
    } catch(e){}
  }
  if (got) {
    state.fxMode = 'online';
    state.fxDate = String(got.date).slice(0, 10) || LOCAL_FX_DATE;
    for (const k in got.rates) state.fxRates[k] = got.rates[k];
    state.fxRates.CNY = 1;
    pill.classList.add('online');
    txt.textContent = '汇率：在线实时';
    pill.title = '汇率来源：' + (got.date || '实时') + ' · 点击重新检测';
  } else {
    state.fxMode = 'local';
    pill.classList.add('local');
    txt.textContent = '汇率：本地留存';
    pill.title = '离线模式，使用本地留存汇率（' + LOCAL_FX_DATE + '）· 点击重试';
  }
  const fx = getCat('currency');
  if (fx) {
    fx.units.forEach(u => {
      const r = state.fxRates[u.id];
      if (r) u.f = 1 / r;
    });
  }
  renderBaseNote();
  renderFooter();
  if (state.cat === 'currency') renderAll();
}

/* ---------- 选择框填充 ---------- */
function fillSelect(sel, cat){
  sel.innerHTML = '';
  cat.units.forEach(u => {
    const op = document.createElement('option');
    op.value = u.id;
    op.textContent = u.n + ' ' + u.id;
    sel.appendChild(op);
  });
}

/* ---------- 分类切换 ---------- */
function setCat(id){
  state.cat = id;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === id));
  const cat = getCat(id);
  if (!cat) return;
  if (cat.type === 'special') {
    $('converterPanel').hidden = true;
    $('datePanel').hidden = false;
    return;
  }
  $('datePanel').hidden = true;
  $('converterPanel').hidden = false;
  $('convTitle').childNodes[0].nodeValue = cat.name + '换算 ';
  let note = cat.type === 'temp' ? '标准公式换算' : (cat.type === 'fx' ? '在线实时 · 本地兜底' : '同类型单位互转');
  if (cat.id === 'data') note = 'KB/MB 按 1000 · KiB/MiB 按 1024';
  if (cat.id === 'duration') note = '月按 30 天 · 年按 365 天';
  $('convNote').textContent = note;
  const rec = store.cats[id] || {};
  const fromId = rec.from && cat.units.some(u => u.id === rec.from) ? rec.from : cat.defFrom;
  const toId   = rec.to   && cat.units.some(u => u.id === rec.to)   ? rec.to   : cat.defTo;
  fillSelect($('fromUnit'), cat);
  fillSelect($('toUnit'), cat);
  $('fromUnit').value = fromId;
  $('toUnit').value = toId;
  $('fromVal').value = (rec.val !== undefined && rec.val !== '') ? rec.val : 1;
  renderAll();
}

/* ---------- 换算渲染 ---------- */
function renderAll(){
  const cat = getCat(state.cat);
  if (!cat || cat.type === 'special') return;
  const v = parseFloat($('fromVal').value);
  const ok = isFinite(v);
  const fromId = $('fromUnit').value, toId = $('toUnit').value;
  const res = ok ? convert(v, cat, fromId, toId) : NaN;
  $('toVal').value = fmt(res);
  const fromU = cat.units.find(u => u.id === fromId) || {};
  $('qFromName').textContent = (fromU.n || '') + ' ' + fromId;
  const curTo = toId;
  $('quickTable').innerHTML = cat.units.map(u => {
    const r = ok ? convert(v, cat, fromId, u.id) : NaN;
    return '<div class="qt-row' + (u.id === curTo ? ' current' : '') + '" data-unit="' + u.id + '">'
      + '<span class="q-name">' + u.n + ' ' + u.id + '</span>'
      + '<span class="q-val">= <b>' + fmt(r) + '</b> ' + u.n + '</span></div>';
  }).join('');
  renderBaseNote();
}

function renderBaseNote(){
  const cat = getCat(state.cat);
  if (!cat || cat.type === 'special') return;
  const note = $('baseNote');
  if (cat.type === 'fx') {
    note.textContent = state.fxMode === 'online'
      ? '汇率来源：在线实时（' + state.fxDate + '）· 断网自动回退本地汇率'
      : '汇率来源：本地留存（' + state.fxDate + '）· 联网后自动更新';
    return;
  }
  if (cat.type === 'temp') { note.textContent = '温度换算使用标准公式（°C / °F / K / °R / °Ré / °N / °Rø / °De）'; return; }
  if (cat.id === 'data') { note.textContent = 'KB、MB、GB 等按十进制（1000）；KiB、MiB、GiB 等按二进制（1024）'; return; }
  if (cat.id === 'duration') { note.textContent = '月按 30 天、年按 365 天、季按 91.25 天近似换算'; return; }
  note.textContent = '共收录 ' + cat.units.length + ' 个单位，可任意两两互转';
}

function renderFooter(){
  $('footNote').textContent = '货币汇率：' + (state.fxMode === 'online' ? '在线实时（' + state.fxDate + '）' : '本地留存基准（' + state.fxDate + '）') + ' · 其余单位换算完全离线可用';
}

/* ---------- 复制结果 ---------- */
function doCopy(){
  const cat = getCat(state.cat);
  if (!cat || cat.type === 'special') return;
  const v = parseFloat($('fromVal').value);
  if (!isFinite(v)) { showToast('请输入有效数值'); return; }
  const text = rawNum(convert(v, cat, $('fromUnit').value, $('toUnit').value));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制结果'), () => fallbackCopy());
  } else fallbackCopy();
}
function fallbackCopy(){
  const el = $('toVal');
  el.select();
  document.execCommand('copy');
  showToast('已复制结果');
}

/* ================= 时间日期工具 ================= */
function pad2(n){ return String(n).padStart(2, '0'); }
const WEEKS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function dtLocalValue(d){
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
       + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtDT(d){
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
       + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds())
       + ' ' + WEEKS[d.getDay()];
}

/* 时间戳互转 */
let tsSyncGuard = false;
function syncTsFromDt(){
  const v = $('tsDt').value;
  if (!v) return;
  const t = new Date(v).getTime();
  $('tsOutSec').textContent = fmt(Math.floor(t / 1000));
  $('tsOutMs').textContent = fmt(t);
  tsSyncGuard = true;
  $('tsNum').value = $('tsUnit').value === 's' ? Math.floor(t / 1000) : t;
  tsSyncGuard = false;
}
function syncTsFromNum(){
  if (tsSyncGuard) return;
  const n = parseFloat($('tsNum').value);
  if (!isFinite(n)) { $('tsDateText').textContent = '—'; return; }
  const ms = $('tsUnit').value === 's' ? n * 1000 : n;
  const d = new Date(ms);
  $('tsDateText').textContent = Number.isNaN(d.getTime()) ? '无效时间戳' : fmtDT(d);
}

/* 日期加减（月/年溢出自动按当月最后一天收尾） */
function addClamped(d, n, unit){
  const day = d.getDate();
  let t;
  if (unit === 'm' || unit === 'y') {
    t = new Date(d.getFullYear() + (unit === 'y' ? n : 0), d.getMonth() + (unit === 'm' ? n : 0), 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last));
  } else if (unit === 'w') {
    t = new Date(d.getTime() + n * 7 * 864e5);
  } else {
    t = new Date(d.getTime() + n * 864e5);
  }
  return t;
}
const UNIT_NAMES = { d: '天', w: '周', m: '月', y: '年' };
function calcAdd(){
  const dStr = $('addDate').value;
  if (!dStr) { $('addResultText').textContent = '请先选择起始日期'; return; }
  const n = parseFloat($('addNum').value) || 0;
  const r = addClamped(new Date(dStr + 'T00:00:00'), n, $('addUnit').value);
  $('addResultText').textContent = r.getFullYear() + '年' + (r.getMonth() + 1) + '月' + r.getDate() + '日 '
    + WEEKS[r.getDay()] + '（' + (n < 0 ? '减' : '加') + ' ' + Math.abs(n) + ' ' + UNIT_NAMES[$('addUnit').value] + '）';
}
function calcDiff(){
  const a = $('diffA').value, b = $('diffB').value;
  if (!a || !b) { $('diffResultText').textContent = '请选择两个日期'; return; }
  const t1 = new Date(a + 'T00:00:00').getTime(), t2 = new Date(b + 'T00:00:00').getTime();
  const days = Math.abs(Math.round((t2 - t1) / 864e5));
  const weeks = Math.floor(days / 7), rem = days % 7;
  $('diffResultText').textContent = days + ' 天 ≈ ' + weeks + ' 周 ' + rem + ' 天，约 ' + (days / 30.44).toFixed(1) + ' 个月';
}

/* ================= 初始化 ================= */
(function init(){
  loadStore();

  /* 分类标签 */
  const wrap = $('catTabs');
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat-tab';
    b.dataset.cat = c.id;
    b.innerHTML = c.icon + '<span>' + c.name + '</span>';
    b.addEventListener('click', () => { setCat(c.id); remember(); });
    wrap.appendChild(b);
  });
  setCat(store.cat && CATS.some(c => c.id === store.cat) ? store.cat : 'length');

  /* 换算事件 */
  $('fromVal').addEventListener('input', () => { renderAll(); remember(); });
  $('fromUnit').addEventListener('change', () => { renderAll(); remember(); });
  $('toUnit').addEventListener('change', () => { renderAll(); remember(); });
  $('swapBtn').addEventListener('click', () => {
    const f = $('fromUnit').value;
    $('fromUnit').value = $('toUnit').value;
    $('toUnit').value = f;
    renderAll(); remember();
  });
  $('copyBtn').addEventListener('click', doCopy);
  $('quickTable').addEventListener('click', e => {
    const row = e.target.closest('.qt-row');
    if (!row) return;
    $('toUnit').value = row.dataset.unit;
    renderAll(); remember();
  });
  $('fxStatus').addEventListener('click', checkFx);

  /* 时间日期工具 */
  $('dateTabs').addEventListener('click', e => {
    const b = e.target.closest('.view-tab');
    if (!b) return;
    document.querySelectorAll('#dateTabs .view-tab').forEach(x => x.classList.toggle('active', x === b));
    ['ts', 'add', 'diff'].forEach(k => { $('dt-' + k).hidden = (b.dataset.dtab !== k); });
  });
  const now = new Date();
  $('tsDt').value = dtLocalValue(now);
  $('tsNowBtn').addEventListener('click', () => { $('tsDt').value = dtLocalValue(new Date()); syncTsFromDt(); });
  $('tsDt').addEventListener('input', syncTsFromDt);
  $('tsNum').addEventListener('input', syncTsFromNum);
  $('tsUnit').addEventListener('change', syncTsFromNum);
  syncTsFromDt();

  $('addDate').value = dtLocalValue(now).slice(0, 10);
  $('diffA').value = dtLocalValue(new Date(now.getTime() - 7 * 864e5)).slice(0, 10);
  $('diffB').value = dtLocalValue(now).slice(0, 10);
  $('addCalcBtn').addEventListener('click', calcAdd);
  $('addTodayBtn').addEventListener('click', () => { $('addDate').value = dtLocalValue(new Date()).slice(0, 10); calcAdd(); });
  $('diffCalcBtn').addEventListener('click', calcDiff);
  ['addDate', 'addNum', 'addUnit'].forEach(id => { $(id).addEventListener('change', calcAdd); });
  ['diffA', 'diffB'].forEach(id => { $(id).addEventListener('change', calcDiff); });
  calcAdd(); calcDiff();

  renderFooter();
  checkFx();
})();

</script>
