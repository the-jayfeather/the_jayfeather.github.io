<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>塔罗占卜 · 在线塔罗</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='6' fill='%23062742' stroke='%2366CCFF' stroke-width='1.6'/%3E%3Cpath d='M12 4.5l2 4.6 5 .4-3.7 3.3 1.1 4.9L12 15.2l-4.4 2.5 1.1-4.9L5 9.5l5-.4z' fill='%2366CCFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=LXGW+WenKai&display=swap">
<style>
/* ============================================================
 * 塔罗牌 · 天依蓝主题
 * 配色沿用站点 style.css：
 * 深海蓝 #062742 / 导航蓝 #225588 / 天依蓝 #66CCFF
 * 浅冰蓝 #BBEEFF / 亮蓝 #99DDFF / 云白 #E0F5FF / 墨蓝 #113355
 * 逆位金 #FFD98A
 * ============================================================ */
:root {
  --bg:#062742; --nav:#225588; --tianyi:#66CCFF; --ice:#BBEEFF;
  --sky:#99DDFF; --cyan:#88DDFF; --cloud:#E0F5FF; --ink:#113355; --ink-deep:#032138;
  --card-bg:rgba(187,238,255,.20);
  --card-solid:rgba(187,238,255,.85);
  --border:rgba(102,204,255,.18);
  --border-strong:rgba(102,204,255,.22);
  --shadow:rgba(34,85,136,.28);
  --bar:rgba(20,35,55,.92);
  --select-bg:rgba(40,70,105,.6);
  --scroll:#44688C; --placeholder:#739CBF;
  --gold:#FFD98A; --gold-soft:#FFE3AE; --gold-deep:#F4C96B;
  --radius:18px;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { height:100%; }
body {
  min-height:100%; margin:0;
  background:var(--bg); color:var(--cloud);
  font-family:'LXGW WenKai','霞鹜文楷','Kaiti SC','STKaiti','KaiTi','楷体','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--tianyi); }

/* ==================== 顶部导航栏 ==================== */
.navbar {
  position:fixed; top:0; left:0; right:0; height:64px;
  background-color:var(--nav);
  box-shadow:0 2px 10px rgba(34,85,136,.4);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; z-index:1000;
}
.brand { display:flex; align-items:center; gap:12px; user-select:none; }
.brand-icon {
  width:36px; height:36px; border-radius:10px;
  background:rgba(102,204,255,.18);
  border:1px solid rgba(102,204,255,.35);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.brand-icon svg { width:22px; height:22px; }
.brand-name {
  font-family:'Microsoft YaHei','微软雅黑',sans-serif;
  font-size:24px; font-weight:bold; color:var(--sky); letter-spacing:2px;
}
.brand-sub { font-size:12px; color:rgba(187,238,255,.65); margin-left:2px; align-self:flex-end; padding-bottom:4px; }
.nav-right { display:flex; align-items:center; gap:14px; }
.view-tabs {
  display:flex; background:var(--bar);
  border:1px solid var(--border-strong); border-radius:9999px; padding:4px; gap:4px;
}
.view-tab {
  border:none; background:transparent; color:var(--ice);
  font-family:inherit; font-size:14px; padding:6px 18px; border-radius:9999px;
  cursor:pointer; transition:all .2s ease; white-space:nowrap;
}
.view-tab:hover { background:rgba(102,204,255,.18); }
.view-tab.active { background:var(--tianyi); color:var(--ink-deep); }
.settings-btn {
  display:flex; align-items:center; justify-content:center;
  width:40px; height:40px; border-radius:12px; flex-shrink:0;
  background:var(--select-bg); border:1px solid var(--border-strong);
  cursor:pointer; transition:all .2s ease; color:var(--ice);
}
.settings-btn svg { width:20px; height:20px; }
.settings-btn:hover {
  background:var(--tianyi); color:var(--ink-deep);
  box-shadow:0 4px 14px rgba(102,204,255,.4);
}

/* ==================== 主布局 ==================== */
.main { padding-top:64px; min-height:100vh; }
.view { display:none; }
.view.active { display:block; }
.content { max-width:1180px; margin:0 auto; padding:18px 20px 30px; }

/* ==================== 通用卡片 ==================== */
.panel {
  background-color:var(--card-bg); border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:0 6px 22px var(--shadow);
  padding:16px 20px; margin-bottom:16px;
}
.panel-title {
  font-size:17px; color:var(--ice); margin:0 0 12px 0;
  display:flex; align-items:center; gap:8px; letter-spacing:1px;
}
.panel-title::before {
  content:''; width:9px; height:9px; border-radius:50%;
  background-color:var(--tianyi); flex-shrink:0;
}
.panel-title .tiny-tag { margin-left:auto; font-size:12px; color:rgba(187,238,255,.55); font-weight:normal; }

/* ==================== 占卜：模式选择 ==================== */
.mode-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.mode-label { font-size:15px; color:var(--sky); letter-spacing:1px; }
.radio-group { display:flex; gap:8px; flex-wrap:wrap; }
.radio-pill {
  padding:6px 16px; border-radius:9999px; border:1px solid var(--border-strong);
  background:var(--select-bg); color:var(--ice); font-size:13px; font-family:inherit;
  cursor:pointer; transition:all .18s ease;
}
.radio-pill:hover { background:rgba(102,204,255,.25); }
.radio-pill.active { background:var(--tianyi); color:var(--ink-deep); border-color:var(--tianyi); }
.status-hint { font-size:14px; color:var(--placeholder); line-height:1.8; margin-top:4px; }

/* ==================== 占卜：抽牌按钮 ==================== */
.draw-wrap { margin:18px 0 6px; text-align:center; }
.draw-btn {
  width:100%; max-width:420px; height:58px; border-radius:9999px; border:none; cursor:pointer;
  background:linear-gradient(120deg, var(--tianyi), #4FB8E8);
  color:var(--ink-deep); font-family:inherit; font-size:20px; font-weight:bold; letter-spacing:5px;
  box-shadow:0 6px 20px rgba(102,204,255,.35);
  transition:all .18s ease;
}
.draw-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 26px rgba(102,204,255,.45); }
.draw-btn:active:not(:disabled) { transform:translateY(0); }
.draw-btn:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }

/* ==================== 占卜：洗牌舞台 ==================== */
.stage-wrap { position:relative; }
.stage {
  position:relative; height:420px; margin-top:10px;
  background:radial-gradient(ellipse at 50% 42%, rgba(102,204,255,.12), rgba(6,39,66,.16) 74%);
  border:1px solid var(--border); border-radius:22px; overflow:hidden;
}
.fcard {
  position:absolute; width:46px; height:78px; border-radius:7px;
  background-color:var(--ink);
  box-shadow:0 3px 10px rgba(3,33,56,.55), inset 0 0 0 1px rgba(102,204,255,.22);
  cursor:pointer; will-change:transform,opacity;
  transition:transform .95s cubic-bezier(.34,.6,.24,1), opacity .35s ease;
  user-select:none; -webkit-user-select:none;
}
.fcard img { width:100%; height:100%; object-fit:cover; border-radius:6px; display:block; }
.fcard.shuf { transition:none; }
@keyframes jitter {
  0%   { transform:translate(0,0) rotate(0deg); }
  25%  { transform:translate(3px,-4px) rotate(2.5deg); }
  50%  { transform:translate(-4px,3px) rotate(-3deg); }
  75%  { transform:translate(3px,4px) rotate(2deg); }
  100% { transform:translate(-2px,-2px) rotate(-1.5deg); }
}
.fcard.jittering { animation:jitter .16s ease-in-out infinite alternate; }
.stage-hint {
  position:absolute; left:0; right:0; bottom:12px; text-align:center;
  font-size:14px; color:var(--placeholder); letter-spacing:1px; pointer-events:none;
}

/* ==================== 占卜：结果区 ==================== */
.result-area {
  display:flex; gap:22px; justify-content:center; align-items:flex-start;
  flex-wrap:wrap; margin-top:22px; min-height:318px;
}
.slot { display:flex; flex-direction:column; align-items:center; gap:10px; width:178px; }
.slot-label {
  font-size:15px; color:var(--sky); letter-spacing:3px;
  padding:3px 12px; border-radius:9999px;
  background:var(--select-bg); border:1px solid var(--border-strong);
}
.slot-label.filled { color:var(--ice); border-color:var(--tianyi); }
.r-card { width:150px; height:250px; perspective:900px; }
.r-inner {
  position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,.1,.2,1);
}
.r-card.flip .r-inner { transform:rotateY(180deg); }
.r-face {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:12px; overflow:hidden;
  border:1px solid var(--border-strong);
  box-shadow:0 8px 24px rgba(3,33,56,.5);
  background:var(--ink);
}
.r-back { background-image:var(--card-back, url('cards/classic/back.png')); background-size:cover; background-position:center; }
.r-front { transform:rotateY(180deg); }
.r-face img { width:100%; height:100%; object-fit:cover; transform:scale(1.06); }
.r-front img.rev { transform:scale(1.06) rotate(180deg); }
.r-tag {
  padding:4px 18px; border-radius:9999px; font-size:14px; letter-spacing:2px;
  opacity:0; transform:translateY(4px); transition:all .35s ease;
}
.r-tag.show { opacity:1; transform:none; }
.r-tag.up { background:var(--tianyi); color:var(--ink-deep); }
.r-tag.down { background:var(--gold); color:var(--ink-deep); }
.r-name { font-size:15px; color:var(--ice); min-height:22px; }
.r-meaning {
  font-size:13.5px; color:var(--sky); line-height:1.55; text-align:center;
  min-height:20px; padding:0 6px; max-width:172px;
}
.again-wrap { margin:20px 0 4px; text-align:center; }
.tool-btn {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:36px; height:38px; padding:0 18px; border-radius:12px;
  background:var(--select-bg); border:1px solid var(--border-strong);
  color:var(--ice); font-family:inherit; font-size:15px; cursor:pointer;
  transition:all .2s ease; letter-spacing:1px;
}
.tool-btn:hover { background:rgba(102,204,255,.25); border-color:var(--tianyi); }
.tool-btn:disabled { opacity:.38; cursor:not-allowed; }
.tool-btn.primary { background:var(--tianyi); color:var(--ink-deep); font-weight:bold; }
.tool-btn.primary:hover { background:var(--ice); }
.tool-btn.big-start { height:46px; padding:0 42px; font-size:17px; border-radius:9999px; box-shadow:0 6px 18px rgba(102,204,255,.35); }

/* ==================== 牌库：筛选 ==================== */
.chips-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.g-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:14px;
}
.gtile {
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:14px; padding:9px 9px 7px; cursor:pointer;
  transition:all .2s ease; text-align:center;
}
.gtile:hover { border-color:var(--tianyi); transform:translateY(-3px); box-shadow:0 8px 20px rgba(102,204,255,.18); }
.gt-art { aspect-ratio:3/5; border-radius:9px; overflow:hidden; background:var(--ink); }
.gt-art img { width:100%; height:100%; object-fit:cover; transform:scale(1.06); display:block; }
.gt-name { font-size:13.5px; color:var(--ice); padding:7px 0 3px; }
.gt-en { font-size:10.5px; color:var(--placeholder); }

/* ==================== 详情页 ==================== */
.d-back { margin:6px 0 14px; }
.d-top { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
.d-art { width:270px; flex-shrink:0; }
.d-art-img {
  aspect-ratio:3/5; border-radius:16px; overflow:hidden;
  border:1px solid var(--border-strong); box-shadow:0 10px 30px rgba(3,33,56,.5);
  background:var(--ink); position:relative;
}
.d-art-img img { width:100%; height:100%; object-fit:cover; transform:scale(1.06); display:block; }
.d-theme-pills { display:flex; justify-content:center; gap:8px; margin-top:12px; }
.d-theme-pills .radio-pill { padding:4px 14px; font-size:12.5px; }
.d-info { flex:1; min-width:300px; }
.d-name { margin:0 0 2px; font-size:30px; color:var(--ice); letter-spacing:2px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.d-en { font-size:15px; color:var(--placeholder); letter-spacing:1px; }
.d-badges { display:flex; gap:8px; margin:10px 0 16px; flex-wrap:wrap; }
.d-badge {
  font-size:13px; padding:3px 14px; border-radius:9999px;
  background:var(--select-bg); border:1px solid var(--border-strong); color:var(--ice);
}
.d-badge.el { border-color:var(--tianyi); color:var(--sky); }
.d-cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.d-col {
  background:var(--card-bg); border:1px solid var(--border); border-radius:16px;
  padding:16px 20px;
}
.d-col.up-col { border-color:rgba(102,204,255,.4); }
.d-col.down-col { border-color:rgba(255,217,138,.4); }
.d-col h3 {
  margin:0 0 10px; font-size:19px; letter-spacing:2px;
  display:flex; align-items:center; gap:8px;
}
.d-col.up-col h3 { color:var(--ice); }
.d-col.down-col h3 { color:var(--gold-soft); }
.d-col h3::before { content:''; width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.d-col.up-col h3::before { background:var(--tianyi); }
.d-col.down-col h3::before { background:var(--gold); }
.d-row { margin:11px 0; }
.d-row .k { font-size:13.5px; color:var(--sky); letter-spacing:1px; margin-bottom:3px; }
.d-row .v { font-size:15px; color:var(--cloud); line-height:1.75; }
.d-row.first { margin-top:4px; }
@media (max-width:760px) { .d-cols { grid-template-columns:1fr; } }

/* ==================== 模态框 ==================== */
.modal-mask {
  position:fixed; inset:0; background:rgba(4,22,40,.72); backdrop-filter:blur(6px);
  z-index:1100; display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .22s ease;
}
.modal-mask.open { opacity:1; pointer-events:auto; }
.modal {
  width:520px; max-width:calc(100vw - 32px); max-height:84vh; overflow-y:auto;
  background:#0A3352; border:1px solid var(--border-strong); border-radius:20px;
  box-shadow:0 16px 50px rgba(4,22,40,.6); padding:22px 24px;
  transform:translateY(14px) scale(.98); transition:transform .22s ease;
}
.modal-mask.open .modal { transform:none; }
.modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.modal-head h2 {
  margin:0; font-size:20px; color:var(--ice); letter-spacing:2px;
  display:flex; align-items:center; gap:8px;
}
.modal-head h2::before { content:''; width:10px; height:10px; border-radius:50%; background:var(--tianyi); }
.modal-close {
  width:34px; height:34px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--select-bg); color:var(--ice); font-size:18px; cursor:pointer;
  font-family:inherit; line-height:1;
  display:flex; align-items:center; justify-content:center; transition:all .2s ease;
}
.modal-close:hover { background:var(--tianyi); color:var(--ink-deep); }
.modal-body { font-size:15px; color:var(--cloud); line-height:1.9; }
.set-title { font-size:14px; color:var(--sky); padding:8px 4px 2px; letter-spacing:1px; }
.set-sep { border-top:1px dashed rgba(102,204,255,.25); margin:16px 0 6px; }
.set-row {
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:8px 4px; font-size:14px; color:var(--cloud);
}
.set-note { font-size:12px; color:var(--placeholder); padding:0 4px 6px; line-height:1.7; }
.theme-preview { display:flex; justify-content:center; align-items:center; gap:14px; padding:12px 0 6px; }
.tp-card {
  width:64px; aspect-ratio:3/5; border-radius:9px; overflow:hidden;
  border:2px solid var(--border-strong); background:var(--ink);
  transition:all .2s ease; opacity:.7;
}
.tp-card.active { border-color:var(--tianyi); opacity:1; box-shadow:0 4px 16px rgba(102,204,255,.3); }
.tp-card img { width:100%; height:100%; object-fit:cover; display:block; }
.tp-name { text-align:center; font-size:12px; color:var(--placeholder); margin-top:6px; }
.switch { position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0; cursor:pointer; }
.switch input { opacity:0; width:0; height:0; }
.switch .slider {
  position:absolute; inset:0;
  background:var(--select-bg); border:1px solid var(--border-strong);
  border-radius:9999px; transition:all .22s ease;
}
.switch .slider::before {
  content:''; position:absolute; left:2px; top:2px;
  width:16px; height:16px; border-radius:50%;
  background:var(--placeholder); transition:all .22s ease;
}
.switch input:checked + .slider { background:var(--tianyi); border-color:var(--tianyi); }
.switch input:checked + .slider::before { transform:translateX(18px); background:var(--ink-deep); }

/* ==================== Toast ==================== */
.toast {
  position:fixed; left:50%; bottom:36px;
  transform:translateX(-50%) translateY(20px);
  background:var(--bar); border:1px solid var(--border-strong); color:var(--ice);
  padding:10px 22px; border-radius:9999px; font-size:14px;
  box-shadow:0 8px 26px rgba(4,22,40,.55);
  opacity:0; pointer-events:none; transition:all .28s ease;
  z-index:1300; max-width:80vw; text-align:center;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ==================== 页脚 ==================== */
.footer {
  margin-top:auto; padding:16px 0 24px; text-align:center;
  color:var(--sky); font-size:12.5px; border-top:1px solid var(--border);
}

/* ==================== 响应式 ==================== */
@media (max-width:640px) {
  .brand-sub { display:none; }
  .brand-name { font-size:20px; }
  .view-tab { padding:8px 14px; font-size:14px; min-width:44px; min-height:44px; }
  .radio-pill { min-width:48px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .modal-close { width:40px; height:40px; }
  .settings-btn { width:44px; height:44px; }
.stage { height:330px; }
  .result-area { gap:14px; }
  .slot { width:148px; }
  .r-card { width:120px; height:200px; }
  .g-grid { grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:10px; }
  .d-art { width:210px; }
  .content { padding:14px 14px 24px; }
}
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; }
}
</style>
</head>
<body>

<!-- ==================== 顶部导航 ==================== -->
<nav class="navbar">
  <div class="brand">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#66CCFF" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
        <path d="M12 6l1.8 4.2 4.6.4-3.5 3 1 4.6L12 15.6l-3.9 2.6 1-4.6-3.5-3 4.6-.4z" fill="#66CCFF" stroke="none"/>
      </svg>
    </span>
    <span class="brand-name">一只松鸦羽的塔罗牌</span>
    <span class="brand-sub">网页版 · 在线塔罗</span>
  </div>
  <div class="nav-right">
    <div class="view-tabs" id="viewTabs">
      <button class="view-tab active" data-view="divine" type="button">网页占卜</button>
      <button class="view-tab" data-view="gallery" type="button">卡牌介绍</button>
    </div>
    <button class="settings-btn" id="settingsBtn" type="button" aria-label="设置">

/* ==================== 全局状态 ==================== */
const state = {
  theme: 'classic',        // classic | simple
  anim: true,              // 是否播放洗牌动画
  mode: 'three',           // three | single
  deck: [],                // 洗牌后的 78 张牌（随机顺序 + 随机正逆位）
  picks: [],               // 已抽出的牌 {card, rev}
  nextPick: 0,             // 下一个应点的槽位索引
  busy: false,
  fcards: [],              // 舞台上的面朝下卡片元素
  tween: null,
  stageW: 0, stageH: 0,
  prevSizes: { w:0, h:0 }
};
const CARD_BACK = { classic: 'cards/classic/back.png', simple: 'cards/simple/back.png' };
const cardImg = (c, rev) => {
  const s = state.theme;
  const u = `cards/${s}/${c.f}.png`;
  return `<img src="${u}" alt="${c.n}"${rev ? ' class="rev"' : ''}>`;
};
const setTheme = t => {
  state.theme = t;
  document.body.style.setProperty('--card-back', `url('${CARD_BACK[t]}')`);
  syncThemeUI();
};

/* ==================== 视图路由 ==================== */
const VIEWS = ['divine', 'gallery', 'detail'];
function switchView(v) {
  VIEWS.forEach(x => {
    $('view-' + x).classList.toggle('active', x === v);
  });
  document.querySelectorAll('.view-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.view === v);
  });
  window.scrollTo({ top: 0 });
  if (v === 'gallery') renderGallery();
  if (v === 'divine') layoutFan(true);
}
function renderCurrentRoute() {
  const h = location.hash;
  if (h.startsWith('#card-')) {
    const id = h.slice(6);
    const c = CARDS.find(x => x.f === id);
    if (c) { renderDetail(c); switchView('detail'); return; }
  }
  const v = h.slice(1);
  if (VIEWS.includes(v)) switchView(v); else switchView('divine');
}

/* ==================== 占卜：洗牌 ==================== */
function startDraw() {
  if (state.busy) return;
  state.busy = true;
  state.picks = [];
  state.nextPick = 0;
  $('drawBtn').disabled = true;
  $('againWrap').hidden = true;
  $('resultArea').innerHTML = '';
  $('stage').hidden = false;
  const stage = $('stage');
  state.stageW = stage.clientWidth;
  state.stageH = stage.clientHeight;
  state.prevSizes = { w: state.stageW, h: state.stageH };

  // 洗牌：随机顺序 + 随机正逆位
  state.deck = CARDS.map((c, i) => ({ card: c, rev: Math.random() < 0.5 }))
    .sort(() => Math.random() - 0.5);

  if (!state.anim) { buildFanDeck(); return; }

  // —— 阶段 1：整副牌打乱 ——
  stage.innerHTML = '';
  state.fcards = [];
  const fw = 46, fh = 78;
  const midX = state.stageW / 2 - fw / 2;
  const midY = state.stageH / 2 - fh / 2 - 8;
  state.deck.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'fcard';
    d.style.left = midX + 'px';
    d.style.top = midY + 'px';
    d.style.transform = 'rotate(' + ((Math.random() - 0.5) * 7) + 'deg)';
    d.innerHTML = `<img src="${CARD_BACK[state.theme]}">`;
    stage.appendChild(d);
    state.fcards.push(d);
  });
  $('stageHint').textContent = '整副牌正在打乱……';
  state.fcards.forEach(d => d.classList.add('shuf'));
  awaitF(140);
  state.fcards.forEach(d => d.classList.remove('shuf'));
  state.fcards.forEach((d, i) => {
    const a = (i / 78) * Math.PI * 2;
    const r = 78 + Math.random() * 74;
    d.style.transform =
      'translate(' + (Math.cos(a) * r) + 'px,' + (Math.sin(a) * r) + 'px) rotate(' +
      ((Math.random() - 0.5) * 22) + 'deg)';
  });
  awaitF(430);

  // —— 阶段 2：聚拢到一堆 ——
  $('stageHint').textContent = '聚拢成堆……';
  state.fcards.forEach((d, i) => {
    d.style.transform =
      'translate(' + (Math.cos(i * 1.7) * (1.5 + Math.random() * 1.2)) + 'px,' +
      (Math.sin(i * 1.7) * (1.5 + Math.random() * 1.2)) + 'px) rotate(' +
      ((Math.random() - 0.5) * 10) + 'deg)';
  });
  awaitF(420);

  // —— 阶段 3：摆成扇形 ——
  fanSpread();
}
/* 扇形几何：枢轴位于舞台底部下方 20px，卡片沿圆弧均匀展开、径向朝外。
 * 半径由舞台高度决定，保证最上方卡牌顶部距舞台顶约 18px；
 * 横向按舞台宽度自动收窄张开角，任何视口下都不超出显示框。 */
function fanGeom(i, n) {
  const fw = 46, fh = 78;
  const cx = state.stageW / 2;
  const pivotY = state.stageH + 20;
  const R = Math.max(110, pivotY - 58);            // 卡片中心到枢轴的距离
  const off = R + fh / 2;                          // 卡片顶边到枢轴的距离（即 transform-origin 偏移）
  const maxHalf = Math.min(50, Math.asin(Math.min(1, (state.stageW / 2 - 46) / off)) * 180 / Math.PI);
  const half = Math.max(24, maxHalf);
  const span = n <= 1 ? 0 : half * 2;
  const ang = n <= 1 ? 0 : (-half + i * (span / (n - 1))) * Math.PI / 180;
  return { left: cx - fw / 2, top: pivotY - off, origin: 'center ' + off + 'px', rot: ang };
}
function applyFanGeom(d, i, n) {
  const g = fanGeom(i, n);
  d.style.left = g.left + 'px';
  d.style.top = g.top + 'px';
  d.style.transformOrigin = g.origin;
  d.style.transform = 'rotate(' + g.rot + 'rad)';
}
function fanSpread() {
  $('stageHint').textContent = '';
  const n = state.fcards.length;
  state.fcards.forEach((d, i) => applyFanGeom(d, i, n));
  state.busy = false;
  $('drawBtn').disabled = false;
  if (state.mode === 'three') $('stageHint').textContent = '请依次点选 3 张牌（过去 · 现在 · 未来）';
  else $('stageHint').textContent = '请点选 1 张牌';
}
function buildFanDeck() {
  const stage = $('stage');
  stage.innerHTML = '';
  state.fcards = [];
  const n = 78;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'fcard';
    applyFanGeom(d, i, n);
    d.innerHTML = `<img src="${CARD_BACK[state.theme]}">`;
    stage.appendChild(d);
    state.fcards.push(d);
  }
  state.busy = false;
  $('drawBtn').disabled = false;
  if (state.mode === 'three') $('stageHint').textContent = '请依次点选 3 张牌（过去 · 现在 · 未来）';
  else $('stageHint').textContent = '请点选 1 张牌';
}
function layoutFan(instant) {
  if (state.fcards.length === 0) return;
  const stage = $('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!instant && w === state.prevSizes.w && h === state.prevSizes.h) return;
  state.prevSizes = { w, h };
  state.stageW = w; state.stageH = h;
  const n = state.fcards.length;
  state.fcards.forEach((d, i) => applyFanGeom(d, i, n));
}

/* ==================== 占卜：抽牌 ==================== */
function onFanClick(e) {
  if (state.busy || state.picks.length >= needPicks()) return;
  const el = e.target.closest('.fcard');
  if (!el) return;
  const idx = state.fcards.indexOf(el);
  if (idx < 0) return;
  const entry = state.deck[idx];
  const rev = entry.rev;
  const slotIdx = state.picks.length;
  // 先移除该卡，其余卡整体缩小让位
  state.fcards.splice(idx, 1);
  state.deck.splice(idx, 1);
  el.remove();
  const old = $('stageHint');
  old.textContent = '';
  state.fcards.forEach(d => d.style.transform += ' scale(.82)');
  spawnResultSlot(entry.card, rev, slotIdx);
  const remain = needPicks() - state.picks.length;
  if (remain > 0) {
    toast(`已抽 ${state.picks.length} 张，还差 ${remain} 张`);
  } else {
    state.busy = true;
    $('drawBtn').disabled = true;
    $('stage').hidden = true;
    $('againWrap').hidden = false;
    toast(state.mode === 'three' ? '三牌阵完成' : '占卜完成');
  }
}
function needPicks() { return state.mode === 'three' ? 3 : 1; }
function spawnResultSlot(card, rev, slotIdx) {
  const area = $('resultArea');
  const labels = state.mode === 'three' ? ['过去', '现在', '未来'] : ['今日之牌'];
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.innerHTML = `
    <div class="slot-label">${labels[slotIdx]}</div>
    <div class="r-card"><div class="r-inner">
      <div class="r-face r-back"></div>
      <div class="r-face r-front">${cardImg(card, rev)}</div>
    </div></div>
    <div class="r-tag"></div>
    <div class="r-name"></div>
    <div class="r-meaning"></div>
  `;
  area.appendChild(slot);
  state.picks.push({ card, rev });
  awaitF(150);
  requestAnimationFrame(() => slot.querySelector('.r-card').classList.add('flip'));
  awaitF(520);
  const tag = slot.querySelector('.r-tag');
  tag.textContent = rev ? '逆位' : '正位';
  tag.classList.add('show', rev ? 'down' : 'up');
  slot.querySelector('.r-name').textContent = `${card.n}${rev ? '（逆位）' : ''}`;
  slot.querySelector('.r-meaning').textContent = rev ? card.r : card.u;
  if (slotIdx === needPicks() - 1 && state.mode === 'three') {
    awaitF(280);
    const tip = document.createElement('div');
    tip.style.cssText = 'width:100%;text-align:center;font-size:13.5px;color:var(--placeholder);letter-spacing:1px;';
    tip.textContent = '左起依次为：过去 · 现在 · 未来';
    area.appendChild(tip);
  }
}
function resetDivine() {
  state.busy = false;
  state.picks = [];
  state.nextPick = 0;
  $('stage').hidden = false;
  $('againWrap').hidden = true;
  $('drawBtn').disabled = false;
  $('resultArea').innerHTML = '';
  $('stageHint').textContent = state.mode === 'three' ? '请依次点选 3 张牌（过去 · 现在 · 未来）' : '请点选 1 张牌';
  buildFanDeck();
}

/* ==================== 卡牌介绍 ==================== */
let galleryFilter = 'all';
function renderGallery() {
  const list = CARDS.filter(c => galleryFilter === 'all' || c.g === galleryFilter);
  $('galleryCount').textContent = `${list.length} / 78 张`;
  const grid = $('galleryGrid');
  grid.innerHTML = list.map(c => `
    <div class="gtile" data-f="${c.f}">
      <div class="gt-art"><img src="cards/${state.theme}/${c.f}.png" alt="${c.n}" loading="lazy"></div>
      <div class="gt-name">${c.n}</div>
      <div class="gt-en">${c.e}</div>
    </div>`).join('');
}
function renderDetail(c) {
  $('detailArt').innerHTML = `<img src="cards/${state.theme}/${c.f}.png" alt="${c.n}">`;
  $('detailName').textContent = c.n;
  $('detailName').insertAdjacentHTML('beforeend', `<span class="d-en">${c.e}</span>`);
  $('detailBadges').innerHTML = `
    <span class="d-badge el">元素 · ${c.el}</span>
    <span class="d-badge">${GROUP_NAMES[c.g]}</span>
  `;
  $('detailCols').innerHTML = `
    <div class="d-col up-col">
      <h3>正位</h3>
      <div class="d-row first"><div class="k">简单意义</div><div class="v">${c.u}</div></div>
      <div class="d-row"><div class="k">事业</div><div class="v">${c.uc}</div></div>
      <div class="d-row"><div class="k">爱情</div><div class="v">${c.ul}</div></div>
      <div class="d-row"><div class="k">财运</div><div class="v">${c.uw}</div></div>
    </div>
    <div class="d-col down-col">
      <h3>逆位</h3>
      <div class="d-row first"><div class="k">简单意义</div><div class="v">${c.r}</div></div>
      <div class="d-row"><div class="k">事业</div><div class="v">${c.rc}</div></div>
      <div class="d-row"><div class="k">爱情</div><div class="v">${c.rl}</div></div>
      <div class="d-row"><div class="k">财运</div><div class="v">${c.rw}</div></div>
    </div>`;
  document.querySelectorAll('#detailThemePills .radio-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.dt === state.theme);
  });
}

/* ==================== 工具函数 ==================== */
const awaitF = ms => new Promise(r => setTimeout(r, ms));

/* ==================== 事件绑定 ==================== */
$('drawBtn').addEventListener('click', startDraw);
$('againBtn').addEventListener('click', resetDivine);
$('stage').addEventListener('click', onFanClick);
$('settingsBtn').addEventListener('click', openSettings);
$('settingsClose').addEventListener('click', closeSettings);
$('settingsModal').addEventListener('click', e => { if (e.target === $('settingsModal')) closeSettings(); });
document.querySelectorAll('#modeGroup .radio-pill').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#modeGroup .radio-pill').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.mode = b.dataset.mode;
    $('modeHint').textContent = state.mode === 'three'
      ? '三牌阵：在扇形牌堆中依次点选 3 张，从左到右代表「过去 · 现在 · 未来」。'
      : '单张随机抽：在扇形牌堆中点选 1 张，得到今日之牌。';
    resetDivine();
  });
});
document.querySelectorAll('#galleryChips .radio-pill').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#galleryChips .radio-pill').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    galleryFilter = b.dataset.filter;
    renderGallery();
  });
});
$('galleryGrid').addEventListener('click', e => {
  const t = e.target.closest('.gtile');
  if (t) location.hash = '#card-' + t.dataset.f;
});
$('detailBack').addEventListener('click', () => { location.hash = 'gallery'; });
document.querySelectorAll('#detailThemePills .radio-pill').forEach(p => {
  p.addEventListener('click', () => {
    setTheme(p.dataset.dt);
    document.querySelectorAll('#detailThemePills .radio-pill').forEach(x => x.classList.toggle('active', x === p));
  });
});
document.querySelectorAll('.view-tab').forEach(b => {
  b.addEventListener('click', () => { location.hash = b.dataset.view; });
});
window.addEventListener('hashchange', renderCurrentRoute);
window.addEventListener('resize', () => layoutFan(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSettings();
});
function syncThemeUI() {
  document.querySelectorAll('#detailThemePills .radio-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.dt === state.theme);
  });
  // 已翻开的牌同步换图
  document.querySelectorAll('.r-front').forEach((el, i) => {
    const p = state.picks[i];
    if (p) el.innerHTML = cardImg(p.card, p.rev);
  });
  document.querySelectorAll('#detailArt img').forEach((el, i) => {
    const c = CARDS.find(x => x.f === (location.hash.slice(6)));
    if (c) el.src = `cards/${state.theme}/${c.f}.png`;
  });
  document.querySelectorAll('.gt-art img').forEach(el => {
    const t = el.closest('.gtile');
    if (t) el.src = `cards/${state.theme}/${t.dataset.f}.png`;
  });
}

/* ==================== 初始化 ==================== */
setTheme('classic');
renderCurrentRoute();
</script>
</body>
</html>
