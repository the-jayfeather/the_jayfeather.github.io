    <style>

.leaflet-container .leaflet-tile {

	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {

	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}

.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

	z-index: 1000;
	pointer-events: none;

.leaflet-top {
	top: 0;

.leaflet-right {
	right: 0;

.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}

	cursor: crosshair;

.leaflet-popup-pane,

.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,

	pointer-events: auto;

.leaflet-container {

.leaflet-container a {

	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {

	text-align: center;
	text-decoration: none;
	color: black;

.leaflet-bar a,
.leaflet-control-layers-toggle {

	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;

.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {

	}

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

	}

	}
.leaflet-control-layers-toggle {

	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {

	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,

.leaflet-control-layers-expanded .leaflet-control-layers-list {

.leaflet-control-layers-expanded {

	}
.leaflet-control-layers-scrollbar {

.leaflet-control-layers label {

.leaflet-control-attribution a {

.leaflet-control-attribution a:hover,

.leaflet-left .leaflet-control-scale {

.leaflet-popup {

.leaflet-popup-content-wrapper {

.leaflet-popup-content {

.leaflet-popup-content p {

.leaflet-popup-tip-container {

.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,
.leaflet-oldie .leaflet-popup-tip {

/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;

	-moz-user-select: none;

	user-select: none;
	pointer-events: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

.leaflet-tooltip-bottom {
	margin-top: 6px;

.leaflet-tooltip-top {
	margin-top: -6px;

.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	margin-left: -6px;

.leaflet-tooltip-bottom:before {

	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;

.leaflet-tooltip-right {
	margin-left: 6px;

.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {
	right: 0;
	margin-right: -12px;

	}
.leaflet-tooltip-right:before {

	border-right-color: #fff;

    </script>
    <style>
        /* ====== 亮眼配色版样式（26.9.14：去掉黑色，整体明亮清新）====== */
        /* ====== 天依蓝深色主题（26.10.1：适配「中国行政区划游戏」主题）====== */
        :root {
            --bg-page: linear-gradient(180deg, #062742 0%, #032138 100%);
            --bg-card: rgba(10, 51, 82, 0.85);
            --bg-card-alt: rgba(102, 204, 255, 0.12);
            --bg-deep: #0A3352;
            --bg-panel: rgba(17, 51, 85, 0.85);
            --primary: #66CCFF;
            --primary-dark: #225588;
            --accent-orange: #FF8C42;
            --accent-green: #4ADE80;
            --accent-red: #F87171;
            --accent-gold: #FFD98A;
            --text-main: #E0F5FF;
            --text-sub: #739CBF;
            --text-bright: #BBEEFF;
            --border-color: rgba(102, 204, 255, 0.30);
            --border-light: rgba(102, 204, 255, 0.22);
            --shadow-deep: 0 30px 80px rgba(4, 22, 40, 0.6);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(102, 204, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 204, 255, 0.035) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
        }
        .game-wrap {
            position: relative;
            z-index: 1;
        }

        /* Leaflet 控件深色适配 */
        .leaflet-bar {
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 4px 16px rgba(4, 22, 40, 0.5) !important;
        }
        .leaflet-bar a {
            background: var(--bg-panel) !important;
            color: var(--text-bright) !important;
            border-bottom: 1px solid rgba(102, 204, 255, 0.2) !important;
        }
        .leaflet-bar a:hover {
            background: var(--bg-deep) !important;
            color: var(--primary) !important;
        }
        .leaflet-control-attribution {
            background: rgba(10, 51, 82, 0.7) !important;
            color: #739CBF !important;
        }
        .leaflet-control-attribution a {
            color: #66CCFF !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .game-wrap {
            width: 1400px;
            max-width: 100%;
            background: var(--bg-card);
            border-radius: 28px;
            box-shadow: var(--shadow-deep);
            overflow: hidden;
            border: 1px solid rgba(102, 204, 255, 0.25);
            position: relative;
        }
        .header {
            background: linear-gradient(135deg, #113355, #0A3352, #113355);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(102, 204, 255, 0.25);
        }
        .header h1 {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.75;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-sub);
            font-size: 15px;
            flex-wrap: wrap;
        }
        .status-item {
            background: var(--bg-panel);
            padding: 4px 14px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-bright);
        }
        .status-item .num {
            color: var(--text-main);
            font-weight: 700;
            font-size: 20px;
            min-width: 28px;
            text-align: center;
        }
        .status-item .num.gold {
            color: var(--accent-gold);
        }
        .status-item .num.red {
            color: var(--accent-red);
        }
        .btn-reset {
            background: var(--primary);
            color: #062742;
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-reset:hover {
            background: #4DB8E8;
            transform: scale(1.05);
        }

        .game-panel {
            background: var(--bg-card);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .game-info {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-bright);
            font-size: 16px;
        }
        .game-info .level {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 18px;
        }

        .map-container {
            width: 100%;
            height: 700px;
            background: var(--bg-deep);
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        .float-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            background: rgba(10, 51, 82, 0.92);
            padding: 8px 20px;
            border-radius: 24px;
            border: 1px solid rgba(102, 204, 255, 0.4);
            box-shadow: 0 8px 32px rgba(4, 22, 40, 0.5), 0 0 0 1px rgba(102, 204, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            pointer-events: none;
            max-width: 90%;
        }
        .float-timer {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-red);
            min-width: 50px;
            text-align: center;
            background: rgba(248, 113, 113, 0.14);
            padding: 0 12px;
            border-radius: 30px;
            font-variant-numeric: tabular-nums;
        }
        .float-timer.warning {
            color: #ff0000;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .float-question {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-bright);
            text-align: center;
            flex: 1;
            white-space: normal;
            word-break: break-word;
            line-height: 1.35;
            padding: 2px 0;
        }
        .float-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
        }
        .btn-skip-small {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-skip-small:hover {
            background: #E57329;
        }

        .feedback-area {
            background: var(--bg-card);
            padding: 12px 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            color: var(--text-bright);
            font-size: 16px;
        }
        .feedback-area .msg {
            flex: 1;
            min-width: 150px;
        }
        .feedback-area .score-tip {
            font-weight: 700;
            color: var(--accent-gold);
        }

        .map-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(10, 51, 82, 0.92);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            pointer-events: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            display: inline-block;
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }
        .legend-color.poly {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(102, 204, 255, 0.4);
        }

        .gameover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 33, 56, 0.82);
            backdrop-filter: blur(10px);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: var(--text-bright);
            text-align: center;
            padding: 20px;
        }
        .gameover.show {
            display: flex;
        }
        .gameover-box {
            background: linear-gradient(145deg, #0E3A5C, #0A3352);
            padding: 40px 50px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            max-width: 500px;
            box-shadow: 0 40px 80px rgba(4, 22, 40, 0.6);
        }
        .gameover-box h2 {
            font-size: 36px;
            margin-bottom: 10px;
            color: var(--text-bright);
        }
        .gameover-box .final-score {
            font-size: 72px;
            font-weight: 900;
            color: var(--accent-gold);
            margin: 10px 0;
        }
        .gameover-box .stars {
            font-size: 48px;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }
        .gameover-box .detail {
            color: var(--text-sub);
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn-restart {
            background: var(--accent-green);
            color: #062B3A;
            border: none;
            padding: 10px 30px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-restart:hover {
            background: #3BC06A;
            transform: scale(1.05);
        }

        .level-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .level-btn {
            background: var(--bg-panel);
            border: 1px solid rgba(102, 204, 255, 0.35);
            color: var(--text-bright);
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .level-btn:hover {
            background: var(--bg-card-alt);
        }
        .level-btn.active {
            background: var(--primary);
            color: #062742;
            border-color: var(--primary);
            font-weight: 700;
        }

        .trophy-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1500;
            background: var(--accent-gold);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 217, 138, 0.35);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .trophy-btn:hover {
            transform: translateY(-50%) scale(1.1);
        }
        .rank-panel {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1500;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 16px;
            border: 1px solid var(--border-color);

        // Catmull-Rom 样条插值：在相邻坐标点之间加密过渡点，让山脉线条更圆润流畅
        function smoothCoords(coords, subdivisions) {
            const pts = coords.map(c => [c[0], c[1]]);
            if (pts.length < 3) return pts;
            const out = [];
            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[Math.max(0, i - 1)];
                const p1 = pts[i];
                const p2 = pts[i + 1];
                const p3 = pts[Math.min(pts.length - 1, i + 2)];
                for (let s = 0; s < subdivisions; s++) {
                    const t = s / subdivisions;
                    const t2 = t * t;
                    const t3 = t2 * t;
                    const lon = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
                    const lat = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
                    out.push([lon, lat]);
                }
            }
            out.push(pts[pts.length - 1]);
            return out;
        }

        function buildMountainLayer() {
            mountainLines.forEach(m => {

                const line = L.polyline(latlngs, {
                    color: color,
                    weight: 8,
                    opacity: 0.9,
                    smoothFactor: 0,
                    lineCap: 'round',
                    lineJoin: 'round',
                    interactive: true,
                    mountainName: m.name
                });
                line.on('click', handleMapClick);
                mountainLayerGroup.addLayer(line);
            });
        }

        function buildTerrainLayer() {

                    fillColor: t.color,
                    fillOpacity: 0.4,
                    interactive: true,
                    terrainName: t.name,
                    terrainType: t.type,
                    feature: t.feature
                });
                poly.on('click', handleMapClick);
                terrainLayerGroup.addLayer(poly);
            });
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateAllQuestions(mode, level) {
            const qs = [];

            // 独立关卡：只生成所选关卡的全部题目；单人闯关：全部生成
            const onlyLevel = mode === 'solo' ? level : 0;

            // 第一关：打乱
            if (onlyLevel === 0 || onlyLevel === 1) {
                let q1 = uniqueMountainNames.map(name => {
                    const m = mountainLines.find(m => m.name === name);
                    return {
                        level: 1,
                        type: 'mountain_click',
                        question: `请点击「${name}」`,
                        answer: name,
                        target: name,
                        category: m ? m.category : '',
                        skipped: false
                    };
                });
                shuffleArray(q1);
                qs.push(...q1);
            }

            // 第二关：打乱
            if (onlyLevel === 0 || onlyLevel === 2) {
                let q2 = terrainData.map(t => ({
                    level: 2,
                    type: 'terrain_click',
                    question: `请点击「${t.name}」`,
                    answer: t.name,
                    target: t.name,
                    terrainType: t.type,
                    skipped: false
                }));
                shuffleArray(q2);
                qs.push(...q2);
            }

            // 第三关：独立关卡出全部特征题；闯关模式随机抽9题
            if (onlyLevel === 0 || onlyLevel === 3) {
                const shuffledFeatures = featureQuestions.slice().sort(() => Math.random() - 0.5);
                const selectedFeatures = onlyLevel === 3 ? shuffledFeatures : shuffledFeatures.slice(0, 9);
                selectedFeatures.forEach(f => {
                    qs.push({
                        level: 3,
                        type: 'feature_click',
                        question: f.q,
                        answer: f.answer,
                        target: f.answer,
                        hint: f.q,
                        skipped: false
                    });
                });
            }

            // 第四关：独立关卡出全部题；闯关模式随机抽9题
            if (onlyLevel === 0 || onlyLevel === 4) {
                const shuffledQ4 = q4Manual.slice().sort(() => Math.random() - 0.5);
                const selectedQ4 = onlyLevel === 4 ? shuffledQ4 : shuffledQ4.slice(0, 9);
                selectedQ4.forEach(item => {
                    qs.push({
                        level: 4,
                        type: 'terrain_click',
                        question: item.q,
                        answer: item.answer,
                        target: item.target,
                        skipped: false
                    });
                });
            }

            qs.sort((a, b) => a.level - b.level);
            return qs;

        function nextQuestion() {
            if (currentQuestionIndex >= allQuestions.length) {
                const nextLevel = currentLevel + 1;
                if (gameMode !== 'challenge') {
                    // 独立关卡：本组题目答完即结束，不进入下一关
                    if (skippedQuestions.length > 0 && !isRetakeMode) {

                        setTimeout(() => {
                            currentQuestionIndex = 0;

                    endGame();
                    return;

                if (nextLevel <= 4 && !isRetakeMode) {
                    DOM.feedbackMsg.textContent = `🎉 第 ${currentLevel} 关完成！进入第 ${nextLevel} 关`;
                    highlightedLayers.clear();
                    currentLevel = nextLevel;

                    setLayerVisibility(currentLevel);
                    resetAllStyles();
                    labelGroup.clearLayers();
                    setTimeout(() => {
                        currentQuestionIndex = 0;
                        nextQuestion();
                    }, 500);
                    return;
                } else {
                    if (skippedQuestions.length > 0 && !isRetakeMode) {
                        isRetakeMode = true;
                        DOM.feedbackMsg.textContent = `📝 补考模式：共 ${skippedQuestions.length} 道跳过的题目`;
                        allQuestions = skippedQuestions.slice();
                        shuffleArray(allQuestions);
                        currentQuestionIndex = 0;
                        DOM.levelDisplay.textContent = '补考';
                        DOM.progressDisplay.textContent = `0 / ${allQuestions.length}`;
                        mountainLayerGroup.addTo(map);
                        terrainLayerGroup.addTo(map);
                        labelGroup.clearLayers();
                        DOM.skipBtn.style.display = 'none';
                        setTimeout(() => {
                            currentQuestionIndex = 0;
                            nextQuestion();
                        }, 500);
                        return;
                    } else {
                        endGame();
                        return;
                    }
                }
            }

            currentQ = allQuestions[currentQuestionIndex];
            DOM.floatQuestion.textContent = currentQ.question;
            DOM.progressDisplay.textContent = `${currentQuestionIndex+1} / ${allQuestions.length}`;
            DOM.floatTimer.textContent = '10';
            DOM.floatTimer.classList.remove('warning');
            timeLeft = 10;
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);

            setLayerVisibility(currentLevel);
            resetAllStyles();
            labelGroup.clearLayers();
            isPlaying = true;
            DOM.feedbackMsg.textContent = '⏳ 请点击地图上对应的元素';
            DOM.scoreTip.textContent = '';
            if (isRetakeMode) {
                DOM.skipBtn.style.display = 'none';
            } else {
                DOM.skipBtn.style.display = 'inline-block';
            }
        }

        function tick() {
            timeLeft--;
            DOM.floatTimer.textContent = timeLeft;
            if (timeLeft <= 3) DOM.floatTimer.classList.add('warning');
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }

        function handleTimeout() {
            if (!isPlaying) return;
            isPlaying = false;
            wrong++;
            addScore(-1);
            updateUI();
            DOM.feedbackMsg.textContent = '⏰ 时间到！正确答案已标亮';
            DOM.scoreTip.textContent = '-1';
            playWrongSound();
            // 超时时闪烁红色叉号，并让正确的多边形也亮起
            const correctLayer = (function(){
                let tl = null;
                mountainLayerGroup.eachLayer(l => { if (l.options && l.options.mountainName === currentQ.answer) tl = l; });
                terrainLayerGroup.eachLayer(l => { if (l.options && l.options.terrainName === currentQ.answer) tl = l; });
                return tl;
            })();
            showCorrectAnswer();
            showFlash('wrong', correctLayer);
            setTimeout(() => {
                resetAllStyles();
                currentQuestionIndex++;
                nextQuestion();
            }, 550);
        }

        // 答对后保持高亮的图层（避免被 resetAllStyles 复原）
        const highlightedLayers = new Set();

        function handleMapClick(e) {
            if (!isPlaying) return;
            const layer = e.target;
            let selectedName = null;
            if (layer.options && layer.options.mountainName) {
                selectedName = layer.options.mountainName;
            } else if (layer.options && layer.options.terrainName) {
                selectedName = layer.options.terrainName;
            } else {
                return;
            }

            if (selectedName === currentQ.answer) {
                isPlaying = false;
                clearInterval(timerInterval);
                addScore(2);
                correct++;
                updateUI();
                DOM.feedbackMsg.textContent = '✅ 正确！';
                DOM.scoreTip.textContent = '+2';
                playCorrectSound();
                if (currentQ.type === 'terrain_click' || currentQ.type === 'feature_click') {
                    showFlash('correct', layer);
                }
                if (layer.setStyle) {
                    // 第一关山脉答对用橙色；地形区/特征题用金色
                    const correctColor = currentQ.type === 'mountain_click' ? '#1e88e5' : '#ffd700';
                    layer.setStyle({ color: correctColor, weight: 6, fillOpacity: 0.6 });
                }
                // 答对的图层登记到 highlightedLayers，避免被 resetAllStyles 复原
                highlightedLayers.add(layer);
                showKnowledge(currentQ);
                setTimeout(() => {
                    // 复原其它图层（不触动已答对的 layer）
                    resetAllStyles();
                    currentQuestionIndex++;
                    nextQuestion();
                }, 450);
            } else {
                isPlaying = false;
                clearInterval(timerInterval);
                addScore(-1);
                wrong++;
                updateUI();
                DOM.feedbackMsg.textContent = '❌ 错误！';
                DOM.scoreTip.textContent = '-1';
                playWrongSound();
                if (layer.setStyle) {
                    layer.setStyle({ color: '#F87171', weight: 6, fillOpacity: 0.5 });
                }
                showFlash('wrong', layer);
                showCorrectAnswer();
                setTimeout(() => {
                    resetAllStyles();
                    currentQuestionIndex++;
                    nextQuestion();
                }, 550);
            }
        }

        // 全屏中央闪烁反馈：绿色对勾 / 红色叉号
        function showFlash(type, layer) {
            const overlay = document.getElementById('flashOverlay');
            const icon = document.getElementById('flashIcon');
            if (!overlay || !icon) return;
            overlay.classList.remove('show', 'correct', 'wrong');
            icon.classList.remove('polygon-correct-flash', 'polygon-wrong-flash');
            // Force reflow to restart animation
            void overlay.offsetWidth;
            if (type === 'correct') {
                icon.textContent = '\u2713';
                overlay.classList.add('correct');
            } else {
                icon.textContent = '\u2717';
                overlay.classList.add('wrong');
            }
            overlay.classList.add('show');
            if (layer && layer.getElement) {
                const el = layer.getElement();
                if (el) {
                    el.classList.remove('polygon-correct-flash', 'polygon-wrong-flash');
                    void el.offsetWidth;
                    el.classList.add(type === 'correct' ? 'polygon-correct-flash' : 'polygon-wrong-flash');
                }
            }
            setTimeout(() => {
                overlay.classList.remove('show', 'correct', 'wrong');
            }, 1200);
        }

        function showCorrectAnswer() {
            const ans = currentQ.answer;
            let targetLayer = null;
            mountainLayerGroup.eachLayer(l => {
                if (l.options && l.options.mountainName === ans) targetLayer = l;
            });
            terrainLayerGroup.eachLayer(l => {
                if (l.options && l.options.terrainName === ans) targetLayer = l;
            });
            if (targetLayer && targetLayer.setStyle) {
                targetLayer.setStyle({ color: '#4ADE80', weight: 7, fillOpacity: 0.5 });
            }
        }

        function showKnowledge(q) {
            let msg = '';
            if (q.type === 'mountain_click') {
                const m = mountainLines.find(m => m.name === q.answer);
                if (m) msg = `走向：${m.category}`;
            } else if (q.type === 'terrain_click' || q.type === 'feature_click') {
                const t = terrainMap[q.answer];
                if (t) msg = `${t.feature}`;
            }
            if (msg) {
                DOM.feedbackMsg.textContent = `📖 ${msg}`;
            }
        }

        function resetAllStyles() {
            mountainLayerGroup.eachLayer(l => {
                // 跳过已答对且正在保持高亮的图层
                if (highlightedLayers.has(l)) return;
                const name = l.options.mountainName;
                var foundM = mountainLines.find(function(m){ return m.name === name; });
                var cat = (foundM && foundM.category) || '纵向';
                const color = categoryColors[cat] || '#ffffff';
                l.setStyle({ color: color, weight: 8, opacity: 0.9 });
            });
            terrainLayerGroup.eachLayer(l => {
                if (highlightedLayers.has(l)) return;
                const name = l.options.terrainName;
                const t = terrainMap[name];
                if (t) {
                    l.setStyle({ color: '#000000', weight: 3, fillColor: t.color, fillOpacity: 0.4 });
                }
            });
        }

        // 星级计算：满分3星（≥80% → 3星，≥50% → 2星，≥30% → 1星）
        function calcStars(maxScore) {
            return score >= maxScore * 0.8 ? 3 : (score >= maxScore * 0.5 ? 2 : (score >= maxScore * 0.3 ? 1 : 0));
        }

        function updateUI() {
            const maxScore = (gameMode === 'solo' && allQuestionsCache.length > 0) ? allQuestionsCache.length * 2 : 100;
            DOM.scoreDisplay.textContent = calcStars(maxScore);
            DOM.correctDisplay.textContent = correct;
            DOM.wrongDisplay.textContent = wrong;
        }

        // ================================================================
        // 7. 跳过、重置、开始
        // ================================================================
        DOM.skipBtn.addEventListener('click', function() {
            if (!isPlaying || isRetakeMode) return;
            skippedQuestions.push(currentQ);
            isPlaying = false;
            clearInterval(timerInterval);
            DOM.feedbackMsg.textContent = `⏭ 已跳过，稍后补考`;
            DOM.scoreTip.textContent = '';
            setTimeout(() => {
                currentQuestionIndex++;
                nextQuestion();
            }, 300);
        });

        DOM.startBtn.addEventListener('click', function() {
            DOM.startOverlay.classList.add('hidden');
            startGame();
        });

        DOM.resetBtn.addEventListener('click', function() {
            showHome();
        });

        DOM.restartBtn.addEventListener('click', function() {
            showHome();
        });

        // ================================================================
        // 8. 排行榜显示切换
        // ================================================================
        DOM.trophyBtn.addEventListener('click', function() {
            if (DOM.rankPanel.classList.contains('show')) {
                DOM.rankPanel.classList.remove('show');
            } else {
                DOM.rankPanel.classList.add('show');
                renderLeaderboard();
            }
        });

        // ================================================================
        // 9. 游戏结束（保存排行榜）
        // ================================================================
        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            resetAllStyles();
            const total = Math.floor((Date.now() - startTime) / 1000);
            totalSeconds = total;

            const maxScore = gameMode === 'solo' ? allQuestionsCache.length * 2 : 100;
            const stars = calcStars(maxScore);
            DOM.finalScore.textContent = stars > 0 ? '⭐'.repeat(stars) : '💪';
            DOM.finalStars.textContent = stars === 3 ? '优秀！' : (stars === 2 ? '良好！' : (stars === 1 ? '继续加油！' : '再练练'));
            DOM.finalDetail.textContent = (gameMode === 'solo'
                ? `独立第 ${soloLevel} 关全部 ${allQuestionsCache.length} 题 · `
                : '') + `正确 ${correct} · 错误 ${wrong} · 用时 ${total}s · 星级 ${stars}/3`;
            DOM.gameoverTitle.textContent = skippedQuestions.length > 0
                ? (gameMode === 'solo' ? '🎉 独立关卡补考完成！' : '🎉 补考完成！')
                : (gameMode === 'solo' ? '🎉 独立关卡完成！' : '🎉 闯关完成！');
            DOM.levelDisplay.textContent = gameMode === 'solo' ? `第 ${soloLevel} 关完成！` : '完成！';
            // 排行榜仅记录单人闯关模式星级
            if (gameMode === 'challenge') {
                saveLeaderboard({ stars: stars, time: total });
            }
            DOM.gameoverOverlay.classList.add('show');
            DOM.feedbackMsg.textContent = '🎉 挑战结束！';
            DOM.scoreTip.textContent = '';
            DOM.progressDisplay.textContent = `${allQuestionsCache.length} / ${allQuestionsCache.length}`;
            DOM.floatQuestion.textContent = '🎯 本轮结束';
            DOM.floatTimer.textContent = '--';
            DOM.skipBtn.style.display = 'none';
            renderLeaderboard();
        }

        // ================================================================
        // 10. 关卡切换
        // ================================================================
        levelBtnEls.forEach(btn => {
            btn.addEventListener('click', function() {
                if (!gameStarted || gameMode !== 'challenge') return;
                const level = parseInt(this.dataset.level);
                if (level === currentLevel) return;
                currentLevel = level;
                filterQuestionsByLevel(level);
                setLayerVisibility(level);
                highlightedLayers.clear();
                resetAllStyles();
                labelGroup.clearLayers();
                currentQuestionIndex = 0;
                if (!DOM.gameoverOverlay.classList.contains('show')) {
                    nextQuestion();
                } else {
                    startGame();
                }
            });
        });

        let resizeTm = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTm);
            resizeTm = setTimeout(() => {
                map.invalidateSize();
                // 屏幕尺寸变化后重新自适应整幅中国地图，保持比例固定
                map.fitBounds([
                    [18, 73],
                    [54, 135]
                ]);
            }, 150);
        });

        // ================================================================
        // 11. 音效
        // ================================================================
        let audioCtx = null;

        function playBeep(freq, duration, type = 'sine', volume = 0.3) {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = type;
                oscillator.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) { /* 静默 */ }
        }

        function playCorrectSound() {
            playBeep(523, 0.15, 'sine', 0.3);
            setTimeout(() => playBeep(659, 0.15, 'sine', 0.3), 150);
            setTimeout(() => playBeep(784, 0.2, 'sine', 0.3), 300);
        }

        function playWrongSound() {
            playBeep(200, 0.4, 'sawtooth', 0.2);
        }

        // ================================================================
        // 12. 图例
        // ================================================================
        const legendContainer = document.getElementById('legendContainer');
        Object.keys(categoryColors).forEach(cat => {
            const div = document.createElement('div');
            div.className = 'legend-row';
            div.innerHTML = `<span class="legend-color" style="background:${categoryColors[cat]};"></span> ${cat}`;
            legendContainer.appendChild(div);
        });
        const typeColors = {
            '高原': '#3b82f6',
            '盆地': '#daa520',
            '平原': '#7cb342',
            '丘陵': '#a9b0b0'
        };
        ['高原', '盆地', '平原', '丘陵'].forEach(type => {
            const div = document.createElement('div');
            div.className = 'legend-row';
            div.innerHTML = `<span class="legend-color poly" style="background:${typeColors[type]};"></span> ${type}`;
            legendContainer.appendChild(div);
        });

        // ================================================================
        // 12.5 模式辅助：计分、首页模式选择
        // ================================================================
        function addScore(delta) {
            score = Math.max(0, score + delta);
        }

        function showHome() {
            clearInterval(timerInterval);
            isPlaying = false;
            gameStarted = false;
            gameMode = 'challenge';
            soloLevel = 1;
            highlightedLayers.clear();
            DOM.homeOverlay.classList.add('show');
            DOM.gameoverOverlay.classList.remove('show');
            DOM.startOverlay.classList.add('hidden');
            DOM.floatQuestion.textContent = '从首页选择玩法';
            DOM.floatTimer.textContent = '--';
            DOM.levelDisplay.textContent = '待开始';
            DOM.progressDisplay.textContent = '0 / 0';
            DOM.scoreDisplay.textContent = '0';
            DOM.correctDisplay.textContent = '0';
            DOM.wrongDisplay.textContent = '0';
            DOM.feedbackMsg.textContent = '💡 在首页选择玩法后开始';
            DOM.scoreTip.textContent = '';
            labelGroup.clearLayers();
            mountainLayerGroup.addTo(map);
            terrainLayerGroup.remove();
            resetAllStyles();
            renderLeaderboard();
        }

        document.getElementById('modeChallengeBtn').addEventListener('click', function() {
            gameMode = 'challenge';
            soloLevel = 1;
            DOM.homeOverlay.classList.remove('show');
            DOM.startOverlay.classList.remove('hidden');
        });

        document.querySelectorAll('.mode-level').forEach(btn => {
            btn.addEventListener('click', function() {
                gameMode = 'solo';
                soloLevel = parseInt(this.dataset.soloLevel);
                DOM.homeOverlay.classList.remove('show');
                startGame();
            });
        });

        // ================================================================
        // 13. 初始化
        // ================================================================
        showHome();
        // 环境自检：万一 Leaflet 加载异常，给出可见提示而不是黑屏
        if (typeof L === 'undefined') {
            document.body.innerHTML = '<div style="color:#F87171;padding:40px;font-size:18px;text-align:center;">地图引擎加载失败，请更换浏览器（推荐 Chrome/Edge 新版）后重试。</div>';
        }
        console.log('🏔️ 中国地形闯关游戏 星级版 26.9.14 已加载');
    </script>
