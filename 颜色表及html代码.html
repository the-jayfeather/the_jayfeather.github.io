<style>
/* ============================================================
 * 颜色表 · 天依配色（取色自洛天依导航站 style.css）
 * 深海蓝 #062742 / 导航蓝 #225588 / 天依蓝 #66CCFF
 * 浅冰蓝 #BBEEFF / 亮蓝 #99DDFF / 云白 #E0F5FF / 墨蓝 #113355
 * ============================================================ */
:root {
  --bg: #062742;
  --nav: #225588;
  --tianyi: #66CCFF;
  --ice: #BBEEFF;
  --sky: #99DDFF;
  --cyan: #88DDFF;
  --cloud: #E0F5FF;
  --ink: #113355;
  --ink-deep: #032138;
  --card-bg: rgba(187, 238, 255, 0.20);
  --card-solid: rgba(187, 238, 255, 0.85);
  --border: rgba(102, 204, 255, 0.18);
  --border-strong: rgba(102, 204, 255, 0.22);
  --shadow: rgba(34, 85, 136, 0.28);
  --bar: rgba(20, 35, 55, 0.92);
  --select-bg: rgba(40, 70, 105, 0.6);
  --scroll: #44688C;
  --placeholder: #739CBF;
  --radius: 18px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 80px; }
body {
  min-height: 100%;
  margin: 0;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(102, 204, 255, 0.10), transparent 60%),
    radial-gradient(900px 420px at -10% 20%, rgba(34, 85, 136, 0.35), transparent 55%),
    var(--bg);
  color: var(--cloud);
  font-family: 'LXGW WenKai', '霞鹜文楷', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--tianyi); }

/* ---------- 顶部导航 ---------- */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  background-color: var(--nav);
  box-shadow: 0 2px 10px rgba(34, 85, 136, 0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  z-index: 1000;
}
.brand { display: flex; align-items: center; gap: 12px; user-select: none; }
.brand-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: rgba(102, 204, 255, 0.18);
  border: 1px solid rgba(102, 204, 255, 0.35);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-icon svg { width: 22px; height: 22px; }
.brand-name {
  font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
  font-size: 24px;
  font-weight: bold;
  color: var(--sky);
  letter-spacing: 2px;
}
.brand-sub {
  font-size: 12px;
  color: rgba(187, 238, 255, 0.65);
  margin-left: 2px;
  align-self: flex-end;
  padding-bottom: 4px;
}
.nav-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--select-bg);
  border: 1px solid var(--border-strong);
  border-radius: 9999px;
  padding: 7px 16px;
  width: 300px;
}
.nav-search svg { width: 16px; height: 16px; color: var(--placeholder); flex-shrink: 0; }
.nav-search input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--ice);
  font-family: inherit;
  font-size: 14px;
}
.nav-search input::placeholder { color: var(--placeholder); }

/* ---------- 主区 ---------- */
.main { padding: 64px 22px 40px; max-width: 1180px; margin: 0 auto; }

.panel {
  background-color: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 6px 22px var(--shadow);
  padding: 18px 22px;
  margin-bottom: 18px;
  backdrop-filter: blur(4px);
}
.panel-title {
  font-size: 17px;
  color: var(--ice);
  margin: 0 0 12px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 1px;
}
.panel-title::before {
  content: '';
  width: 9px; height: 9px;
  border-radius: 50%;
  background-color: var(--tianyi);
  flex-shrink: 0;
}
.panel-title .tiny-tag {
  margin-left: auto;
  font-size: 11px;
  color: rgba(187, 238, 255, 0.55);
  font-weight: normal;
}

/* ---------- 标题卡 ---------- */
.hero { text-align: center; padding: 26px 22px 22px; }
.hero h1 {
  margin: 0 0 8px;
  font-size: 28px;
  color: var(--tianyi);
  letter-spacing: 3px;
  text-shadow: 0 0 22px rgba(102, 204, 255, 0.35);
}
.hero .sub {
  font-size: 14px;
  color: var(--sky);
  letter-spacing: 1px;
}
.hero .stats {
  margin-top: 14px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.stat-pill {
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 9999px;
  background: rgba(102, 204, 255, 0.14);
  border: 1px solid rgba(102, 204, 255, 0.28);
  color: var(--ice);
}
.stat-pill b { color: var(--tianyi); }

/* ---------- 表格 ---------- */
.tbl-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 14px;
}
colgroup col.sw { width: 70px; }
colgroup col.en { width: 20%; }
colgroup col.zh { width: 22%; }
colgroup col.hx { width: 19%; }
colgroup col.de { width: 23%; }
thead th {
  text-align: left;
  font-weight: normal;
  color: var(--sky);
  letter-spacing: 1px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-strong);
  white-space: nowrap;
  font-size: 13px;
}
tbody td {
  padding: 7px 12px;
  border-bottom: 1px solid rgba(102, 204, 255, 0.08);
  vertical-align: middle;
}
tbody tr { transition: background 0.14s ease; }
tbody tr:hover { background: rgba(102, 204, 255, 0.12); }
td.sw { text-align: center; }
.swatch {
  display: inline-block;
  width: 42px; height: 42px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  vertical-align: middle;
  transition: transform 0.16s ease;
}
tbody tr:hover .swatch { transform: scale(1.08); }
td.en { color: var(--ice); }
td.zh { color: var(--cloud); }
td.code {
  font-family: Consolas, 'Courier New', monospace;
  font-size: 13px;
  color: var(--sky);
  cursor: pointer;
  user-select: all;
  border-radius: 6px;
  transition: color 0.14s ease, background 0.14s ease;
}
td.code:hover { color: #FFFFFF; background: rgba(102, 204, 255, 0.14); }
tr.no-match { display: none; }

/* ---------- 空结果 ---------- */
.empty-row td {
  padding: 26px 12px;
  text-align: center;
  color: var(--placeholder);
  font-size: 14px;
  letter-spacing: 1px;
}
.empty-row { display: none; }
.empty-row.show { display: table-row; }

/* ---------- 页脚 ---------- */
.footer {
  margin-top: 26px;
  padding: 18px 0 8px;
  text-align: center;
  color: var(--sky);
  font-size: 13px;
  border-top: 1px solid var(--border);
}
.footer .links { margin-top: 6px; }
.footer a { color: var(--ice); text-decoration: none; margin: 0 6px; }
.footer a:hover { color: var(--tianyi); text-decoration: underline; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 36px;
  transform: translateX(-50%) translateY(20px);
  background: var(--bar);
  border: 1px solid var(--border-strong);
  color: var(--ice);
  padding: 10px 22px;
  border-radius: 9999px;
  font-size: 14px;
  box-shadow: 0 8px 26px rgba(4, 22, 40, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: all 0.28s ease;
  z-index: 1300;
  max-width: 80vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 响应式 ---------- */
@media (max-width: 860px) {
  .nav-search { width: 200px; }
  .main { padding: 64px 14px 30px; }
  .hero h1 { font-size: 22px; }
  .panel { padding: 14px 14px; }
  colgroup col.sw { width: 48px; }
  .swatch { width: 34px; height: 34px; }
  td.code { font-size: 12px; }
}
@media (max-width: 560px) {
  .brand-sub { display: none; }
  .brand-name { font-size: 19px; }
  .nav-search { width: 150px; padding: 6px 12px; }
  .hero h1 { letter-spacing: 2px; }
  thead th { font-size: 12px; padding: 8px 8px; white-space: normal; line-height: 1.3; }
  tbody td { padding: 6px 8px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

var tbody = document.getElementById('tbody');
var emptyRow = document.getElementById('emptyRow');
var searchEl = document.getElementById('search');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function render(list) {
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    html += '<tr data-hex="' + c[0] + '">'
      + '<td class="sw"><span class="swatch" style="background:#' + c[0] + '"></span></td>'
      + '<td class="en">' + c[1] + '</td>'
      + '<td class="zh">' + c[2] + '</td>'
      + '<td class="code" data-copy="' + c[3] + '" title="点击复制 ' + c[3] + '">' + c[3] + '</td>'
      + '<td class="code" data-copy="' + c[4] + '" title="点击复制 ' + c[4] + '">' + c[4] + '</td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
  document.getElementById('total').textContent = COLORS.length;
  document.getElementById('shown').textContent = list.length;
  emptyRow.classList.toggle('show', list.length === 0);
}

function doSearch() {
  var q = searchEl.value.trim().toLowerCase();
  if (!q) { render(COLORS); return; }
  var hit = [];
  for (var i = 0; i < COLORS.length; i++) {
    var c = COLORS[i];
    if (c[1].toLowerCase().indexOf(q) > -1
        || c[2].indexOf(q) > -1
        || c[0].toLowerCase().indexOf(q) > -1
        || c[3].toLowerCase().indexOf(q) > -1
        || c[4].indexOf(q) > -1) {
      hit.push(c);
    }
  }
  render(hit);
}

searchEl.addEventListener('input', doSearch);

/* 复制：优先 Clipboard API，失败回退 execCommand */
function copyText(text, done) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
  } else {
    legacyCopy(text, done);
  }
}
function legacyCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  done();
}
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
}

tbody.addEventListener('click', function (e) {
  var cell = e.target.closest('td.code');
  if (!cell) return;
  var val = cell.getAttribute('data-copy');
  copyText(val, function () { showToast('已复制 ' + val); });
});

render(COLORS);
</script>
