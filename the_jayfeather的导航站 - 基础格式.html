<html>
  <head>
    <title>基础格式 - the_jayfeather的导航站</title>
    <link rel="icon" href="icons/ico.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <base target="_blank">
  </head>
  <body>
    <div class="headline_show"></div>
    <div class=card-group>
      <div class=card>
        <img src="icons/xxx.png"></img><br>
        <a href="https://xxx.xx">这是行1第1个</a>
      </div class=card>
      <div class=card>
        <img src="icons/xxx.png"></img><br>
        <a href="https://xxx.xx">这是行1第2个</a>
      </div class=card>
    </div class=card-group>
    <div class=card-group>
      <div class=card>
        <img src="icons/xxx.png"></img><br>
        <a href="https://xxx.xx">这是行2第1个</a>
      </div class=card>
    </div class=card-group>
    <div class=card-group>
      <div class=long_card>
        <img src="icons/xxx.png"></img>
        <a href="xxx.xx">这是行3第1个</a>
      </div class=long_card>
    </div class=card-group>
    <div class="video-box">
      <div class="media-title">这是行4，这里有个视频</div>
      <video src="xxx.xx" controls></video>
    </div>
    <div class="audio-box">
      <div class="media-title">这是行5，这里有个音频</div>
      <audio src="xxx.xx" controls>
    </div>
    <div class="footer_show"></div>
    <script src="./components.js"></script>
  </body>
</html>
